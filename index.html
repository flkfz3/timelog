<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timelog · 时间记录</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{
    /* mint light theme (day) — derived from the app icon */
    --accent:#4CBF97; --accent-2:#3daf87; --accent-soft:#dff3ea;
    --ink:#1F4D3F; --muted:#4d665c; --faint:#59736a; --line:#dcebe3;
    /* mint stays the brand for fills, arcs, rings and chips. Where it has
       to CARRY text it uses the ink ramp instead: #4CBF97 on white is
       2.27:1, which fails even the 3:1 large-text bar. */
    --accent-ink:#15795b; --care-ink:#0369a1;
    --accent-fill:#15795b; --accent-on:#ffffff;
    --star:#e5a50a; --badge:#c62828; --badge-ok:#0a7f5a;
    --hero-tool-bg:rgba(255,255,255,.35);
    --card:#ffffff;
    --card-bg:rgba(255,255,255,.88);
    --card-bd:rgba(255,255,255,.75);
    --card-sh:0 10px 30px rgba(31,77,63,.10);
    --field-bg:#ffffff;
    --well:#e7f2ec; --well-soft:#f6fbf8; --grid-line:#e5f1ea;
    --pg-base:#F2FBF7;
    --pg-glow:
      radial-gradient(40rem 30rem at 10% 0%,rgba(125,222,187,.38),transparent 60%),
      radial-gradient(36rem 28rem at 95% 15%,rgba(91,201,165,.26),transparent 60%),
      radial-gradient(44rem 34rem at 60% 100%,rgba(125,222,187,.22),transparent 62%);
    --hero-bg:linear-gradient(135deg,#7DDEBB,#4CBF97 62%,#3DA98A);
    /* the mint hero keeps its colour; the text on it goes dark, which is
       what makes it legible (white on #7DDEBB is 1.68:1) */
    --hero-fg:#0b3327;
    /* glyph colour ON a --hero-fg-filled shape (the done checkbox) */
    --hero-chk:#7DDEBB;
    --tab-fg:#43705f; --tab-fg-active:#1F4D3F;
    --tabs-line:rgba(31,77,63,.18);
    --toast-bg:#1F4D3F; --toast-fg:#ffffff;
    --warn-bg:#fef3c7; --warn-fg:#92400e; --warn-bd:#f59e0b40; --warn-card:#fffbeb;
    --danger:#dc2626; --danger-soft:#fdecec;
    --ok-bg:#f0fbf4; --ok-bd:#a7f3d0;
    --sh-sm:0 1px 2px rgba(31,77,63,.06);
    --sh-md:0 4px 14px rgba(31,77,63,.08);
    --sh-lg:0 12px 34px rgba(31,77,63,.14);
    --r-s:10px; --r-m:16px; --r-l:22px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  html[data-theme=dark]{
    /* green-navy night theme — same structure, related feel */
    --accent:#5BC9A5; --accent-2:#7DDEBB; --accent-soft:rgba(91,201,165,.24);
    --ink:#e6f3ec; --muted:#a9c2b6; --faint:#93aca0; --line:#28453c;
    --accent-ink:#7DDEBB; --care-ink:#7dd3fc;
    --accent-fill:#5BC9A5; --accent-on:#062018;
    --star:#f0b429; --badge:#c62828; --badge-ok:#0a7f5a;
    --hero-tool-bg:rgba(0,0,0,.25);
    --card:#132b26;
    --card-bg:rgba(16,36,32,.82);
    --card-bd:rgba(125,222,187,.16);
    --card-sh:0 10px 34px rgba(0,12,10,.5);
    --field-bg:#0e211d;
    --well:#1c3831; --well-soft:#10251f; --grid-line:#1d3a33;
    --pg-base:#081a1e;
    --pg-glow:
      radial-gradient(40rem 40rem at 12% 18%,rgba(45,140,110,.42),transparent 60%),
      radial-gradient(38rem 38rem at 88% 12%,rgba(23,95,125,.36),transparent 60%),
      radial-gradient(42rem 42rem at 75% 88%,rgba(16,120,98,.30),transparent 62%),
      radial-gradient(36rem 36rem at 22% 85%,rgba(20,80,105,.34),transparent 60%);
    --hero-bg:linear-gradient(135deg,#123f36,#0e5c49 62%,#0b3c46);
    --hero-fg:#eafff5;
    --hero-chk:#0b3327;
    --tab-fg:rgba(230,243,236,.66); --tab-fg-active:#ffffff;
    --tabs-line:rgba(230,243,236,.22);
    --toast-bg:#0d2a24; --toast-fg:#eafff5;
    --warn-bg:#3a2f10; --warn-fg:#fbbf24; --warn-bd:#f59e0b55; --warn-card:#241f0c;
    --danger:#f87171; --danger-soft:#3a1719;
    --ok-bg:#0e2b20; --ok-bd:#14532d;
    --sh-sm:0 1px 2px rgba(0,0,0,.3);
    --sh-md:0 4px 14px rgba(0,0,0,.35);
    --sh-lg:0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--pg-base)}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",
    "PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased;
    background:var(--pg-base);
    background-image:var(--pg-glow);
    /* NOT background-attachment:fixed — that pins the glow to one viewport
       and leaves a hard 1px step at exactly 100vh on any page taller than
       the screen. Scroll-attached, the positioning area is the whole
       document, so the aurora still animates and nothing gets sliced. */
    background-attachment:scroll;background-size:200% 200%;
    animation:aurora 26s ease-in-out infinite;
    transition:background .4s var(--ease),color .4s var(--ease)}
  @keyframes aurora{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
  /* hard guard: nothing inside may widen the page. overflow-x:clip (not
     hidden) leaves overflow-y visible, so the sticky tab strip still
     sticks to the viewport. */
  .wrap{max-width:min(1000px,100vw);margin:0 auto;padding:26px 22px 60px;
    overflow-x:clip}
  .hero{position:relative;overflow:hidden;border-radius:var(--r-l);
    color:var(--hero-fg);background:var(--hero-bg);
    box-shadow:var(--card-sh);
    padding:34px 30px 30px;margin-bottom:24px}
  .hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;
    height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:170px;
    height:170px;border-radius:50%;background:rgba(255,255,255,.06)}
  .hero h1{font-size:30px;letter-spacing:2px;font-weight:800;display:flex;
    align-items:center;gap:12px}
  .hero p{margin-top:7px;opacity:.92;font-size:14px;letter-spacing:.3px}
  .hero-tools{position:absolute;top:24px;right:26px;display:flex;gap:8px;z-index:2}
  .hero-tools button{background:var(--hero-tool-bg);border:1px solid
    rgba(255,255,255,.25);color:var(--hero-fg);font:inherit;font-size:13px;
    padding:6px 12px;border-radius:8px;cursor:pointer;
    transition:background .2s var(--ease),transform .15s var(--ease)}
  .hero-tools button:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
  .lang-btn{font-weight:700}
  /* theme toggle: bigger, bolder glyph so ☾ stays visible on the dark hero */
  #themeBtn{font-size:16.5px;font-weight:800;line-height:1;min-width:38px;
    color:var(--hero-fg);background:var(--hero-tool-bg);
    text-shadow:0 0 4px rgba(0,0,0,.35)}
  /* ↻ refresh: circular sibling of the other hero tools. Flex stretch sets
     its height to the row; aspect-ratio makes width follow, so it stays a
     circle at every density. .spin turns the glyph while pulls are in
     flight; .upd grows a --star dot = a newer BUILD is deployed and the
     next tap does a full reload. */
  #refreshBtn{font-size:16px;font-weight:800;line-height:1;min-width:0;
    aspect-ratio:1;padding:6px;border-radius:50%;position:relative;
    display:flex;align-items:center;justify-content:center;
    color:var(--hero-fg);background:var(--hero-tool-bg)}
  #refreshBtn .rg{display:inline-block}
  #refreshBtn.spin .rg{animation:rSpin .8s linear infinite}
  @keyframes rSpin{to{transform:rotate(360deg)}}
  #refreshBtn.upd::after{content:"";position:absolute;top:0;right:0;
    width:9px;height:9px;border-radius:50%;background:var(--star)}
  .insight-card{position:relative;z-index:1;margin-top:18px;
    background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
    border-radius:var(--r-m);padding:15px 18px}
  /* the eyebrow was --hero-fg dimmed to .75, which is 3.98:1 in dark */
  .insight-card .ik{font-size:11px;letter-spacing:.6px;text-transform:uppercase;
    opacity:1;margin-bottom:6px;font-weight:700}
  .insight-card .iv{font-size:15px;line-height:1.6}
  /* ---- checkable daily suggestions (insight_actions) ------------------
     Checked items STAY in place, accented, never struck through — the list
     is a trophy shelf, not a burn-down. 20px visual circle, 44px hit area
     via ::before (the todo-row trick). */
  .ia-list{margin-top:12px;border-top:1px solid rgba(255,255,255,.22);padding-top:10px}
  .ia-row{display:flex;align-items:flex-start;gap:10px;padding:4px 0}
  .ia-chk{flex:0 0 auto;width:20px;height:20px;margin-top:2px;border-radius:50%;
    border:2px solid var(--hero-fg);opacity:.6;background:none;cursor:pointer;
    position:relative;padding:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;line-height:1;color:transparent;
    transition:background .18s var(--ease),opacity .18s var(--ease),color .18s var(--ease)}
  .ia-chk::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;
    transform:translate(-50%,-50%);border-radius:50%}
  .ia-chk:hover{opacity:.9}
  .ia-row.done .ia-chk{background:var(--hero-fg);border-color:var(--hero-fg);
    opacity:1;color:var(--hero-chk)}
  .ia-txt{flex:1;min-width:0;font-size:14px;line-height:1.5}
  .ia-row.done .ia-txt{font-weight:600}
  .ia-day{opacity:.7;font-weight:400}
  /* ✕ = not-applicable dismissal; quiet until hovered, 44px hit area */
  .ia-x{flex:0 0 auto;margin-top:2px;width:20px;height:20px;border:none;
    background:none;cursor:pointer;color:var(--hero-fg);opacity:.35;
    font-size:13px;line-height:1;padding:0;position:relative;
    transition:opacity .18s var(--ease)}
  .ia-x::before{content:"";position:absolute;left:50%;top:50%;width:44px;
    height:44px;transform:translate(-50%,-50%);border-radius:50%}
  .ia-x:hover{opacity:.9}
  /* 成就阅览室 — quiet doorway under 今日建议; the room itself is the 成就 tab */
  .ach-link{display:inline-block;margin-top:8px;padding:4px 0;background:none;
    border:none;cursor:pointer;font:inherit;font-size:12.5px;color:var(--hero-fg);
    opacity:.75;letter-spacing:.2px;transition:opacity .18s var(--ease)}
  .ach-link:hover{opacity:1}
  /* ---- 留言 thread (insight_comments) ---------------------------------
     Quiet bubbles: hers right-aligned accent-tinted, the butler's left
     muted. Base styles fit a normal card (the 当日洞察 history card);
     the .insight-card overrides retint it for the mint hero. */
  .cmt-row{display:flex;align-items:flex-end;gap:6px;margin:5px 0}
  .cmt-row.her{justify-content:flex-end}
  .cmt-bub{max-width:80%;padding:6px 11px;border-radius:12px;
    font-size:13px;line-height:1.5;overflow-wrap:anywhere}
  .cmt-row.her .cmt-bub{background:var(--accent-soft);color:var(--ink);
    border-bottom-right-radius:4px}
  .cmt-row.butler .cmt-bub{background:var(--well);color:var(--muted);
    border-bottom-left-radius:4px}
  .cmt-tm{flex-shrink:0;font-size:10.5px;opacity:.55;padding-bottom:2px}
  .cmt-form{display:flex;gap:8px;margin-top:10px}
  .cmt-form input{flex:1;min-width:0;padding:8px 12px;font-size:13px}
  .cmt-form button{padding:8px 14px;font-size:13px;flex-shrink:0}
  .insight-card .cmt-wrap{margin-top:12px;border-top:1px solid rgba(255,255,255,.22);
    padding-top:8px}
  .insight-card .cmt-row.her .cmt-bub{background:rgba(255,255,255,.30);
    color:var(--hero-fg)}
  .insight-card .cmt-row.butler .cmt-bub{background:rgba(255,255,255,.10);
    color:var(--hero-fg);opacity:.9}
  .insight-card .cmt-tm{color:var(--hero-fg)}
  .insight-card .cmt-form input{background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.30);color:var(--hero-fg)}
  .insight-card .cmt-form input::placeholder{color:var(--hero-fg);opacity:.55}
  .insight-card .cmt-form input:focus{border-color:rgba(255,255,255,.6);
    box-shadow:none}
  .insight-card .cmt-form button{background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.30);color:var(--hero-fg)}
  .insight-card .cmt-form button:hover{background:rgba(255,255,255,.28);
    color:var(--hero-fg);border-color:rgba(255,255,255,.45)}
  /* ---- 当日洞察 — past-day recap card on the 今天 tab ----------------- */
  .dh-ins .prose{color:var(--muted);font-size:13.5px}
  .dh-acts{margin-top:12px}
  .dh-k{font-size:11px;letter-spacing:.6px;color:var(--faint);
    font-weight:700;margin-bottom:4px;text-transform:uppercase}
  .dh-act{display:flex;gap:8px;font-size:13px;line-height:1.5;
    padding:2px 0;color:var(--muted)}
  .dh-act.done{color:var(--ink)}
  .dh-chk{flex-shrink:0;width:16px;text-align:center;color:var(--accent-ink)}
  /* celebration burst: a dozen-odd ★ and dots pop up from the checked box,
     then fall with a sway (outer element falls, inner sways) and fade.
     pointer-events:none — never blocks the next tap. */
  .cf-burst{position:fixed;left:0;top:0;z-index:999;pointer-events:none}
  .cf-p{position:absolute;animation:cfFall var(--dur) cubic-bezier(.3,.5,.5,1) both}
  .cf-s{display:block;animation:cfSway var(--sway) ease-in-out infinite alternate;
    font-size:var(--sz);line-height:1;color:var(--c)}
  .cf-s.cf-dot{width:6px;height:6px;border-radius:50%;background:var(--c)}
  @keyframes cfFall{0%{transform:translate(0,0) scale(.5);opacity:0}
    14%{transform:translate(calc(var(--dx)*.3),-16px) scale(1);opacity:1}
    100%{transform:translate(var(--dx),var(--fy)) scale(.85);opacity:0}}
  @keyframes cfSway{from{transform:translateX(-5px) rotate(-16deg)}
    to{transform:translateX(5px) rotate(16deg)}}
  /* ---- insight / assessment prose ------------------------------------
     The stored text is plain text whose structure IS its newlines: a blank
     line ends a paragraph, and a short unpunctuated line is a subheading.
     Spacing is in em so the same block reads right at 15px on the hero and
     at 12px inside a week row. */
  .prose>*{margin:0}
  .prose>*+*{margin-top:.62em}
  .prose>*+.prose-h{margin-top:1em}
  .prose-h{font-weight:700;font-size:1.05em;letter-spacing:.2px}
  .prose+.prose{margin-top:.62em}
  .tabs{display:flex;gap:2px;margin:0 4px 20px;position:relative;flex-wrap:wrap}
  .tab{padding:11px 20px;border:none;background:none;color:var(--tab-fg);
    font:inherit;font-size:15px;cursor:pointer;border-radius:10px 10px 0 0;
    position:relative;transition:color .22s var(--ease)}
  .tab:hover{color:var(--tab-fg-active)}
  .tab.active{color:var(--tab-fg-active);font-weight:650}
  .tab::after{content:"";position:absolute;left:14px;right:14px;bottom:0;
    height:3px;border-radius:3px;background:var(--accent);transform:scaleX(0);
    transform-origin:center;transition:transform .28s var(--ease)}
  .tab.active::after{transform:scaleX(1)}
  .tabs-line{height:1px;background:var(--tabs-line);margin:-22px 0 22px;border-radius:2px}
  section{animation:rise .42s var(--ease)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card{background:var(--card-bg);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--card-bd);
    border-radius:var(--r-m);padding:24px;margin-bottom:18px;
    box-shadow:var(--card-sh)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;
    font-weight:550;letter-spacing:.2px}
  input,select,textarea{font:inherit;width:100%;padding:11px 13px;
    border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--field-bg);
    color:var(--ink);color-scheme:light;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  html[data-theme=dark] input,html[data-theme=dark] select,
  html[data-theme=dark] textarea{color-scheme:dark}
  /* Chromium autofill paints its own white box — pin it to our tokens
     (the 搜索备忘 input showed white in dark theme) */
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-box-shadow:0 0 0 60px var(--field-bg) inset;
    -webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
  #memo-q{background:var(--field-bg);color:var(--ink)}
  input::placeholder,textarea::placeholder{color:var(--faint);opacity:1}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-soft)}
  textarea{resize:vertical;min-height:66px}
  .field{margin-bottom:16px}
  .row{display:flex;gap:18px;align-items:center}
  .hidden{display:none!important}
  .formfoot{display:flex;gap:10px;margin-top:8px}
  button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink);padding:9px 16px;border-radius:var(--r-s);
    font-weight:550;transition:border-color .2s var(--ease),color .2s var(--ease),
    background .2s var(--ease),transform .14s var(--ease),box-shadow .2s var(--ease)}
  button:hover{border-color:var(--accent);color:var(--accent-ink);
    transform:translateY(-1px);box-shadow:var(--sh-sm)}
  button.primary{background:var(--accent-fill);color:var(--accent-on);
    border-color:var(--accent-fill)}
  button.primary:hover{background:var(--accent-2);color:#fff;
    box-shadow:0 6px 18px rgba(76,191,151,.35)}
  button.danger{color:var(--danger);border-color:var(--danger-soft)}
  button.danger:hover{background:var(--danger-soft);color:var(--danger);
    border-color:var(--danger)}
  .chart-title{font-size:14.5px;font-weight:700;margin-bottom:18px}
  /* the 待办 add row: sizes live here, never inline — an inline flex/
     min-width silently outranks the phone layer (the clipped date field) */
  #todo-title{flex:2 1 200px}
  #todo-due{flex:1 1 180px}
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
  .bar-row .lab{width:120px;text-align:right;color:var(--muted);flex-shrink:0;
    display:flex;align-items:center;gap:7px;justify-content:flex-end}
  .bar-row .lab .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .bar-track{flex:1;background:var(--well);border-radius:6px;height:22px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;width:0;transition:width .7s var(--ease)}
  .bar-row .val{width:48px;text-align:left;color:var(--ink);flex-shrink:0;font-weight:650}
  .stats-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
  .stat{background:var(--card-bg);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
    backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--card-bd);border-radius:var(--r-m);
    padding:20px 18px;box-shadow:var(--card-sh)}
  .stat .n{font-size:32px;color:var(--accent-ink);font-weight:800;line-height:1}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:7px;font-weight:550}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .nodata{text-align:center;color:var(--muted);padding:24px}
  /* stacked bar (hours by category by day) */
  .sb-chart{display:flex;align-items:flex-end;gap:6px;height:220px;
    padding:12px 0;border-bottom:1px solid var(--line)}
  .sb-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
    height:100%;justify-content:flex-end;min-width:0}
  .sb-stack{width:70%;display:flex;flex-direction:column-reverse;
    border-radius:4px 4px 0 0;overflow:hidden}
  .sb-seg{width:100%}
  .sb-day .dn{font-size:10px;color:var(--muted);white-space:nowrap}
  /* donut */
  .donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .donut{width:170px;height:170px;flex-shrink:0}
  .donut svg{display:block}
  .donut-legend{flex:1;min-width:180px}
  .dl-row{display:flex;align-items:center;gap:9px;font-size:13px;margin-bottom:8px}
  .dl-row .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
  .dl-row .dlk{flex:1}
  .dl-row .dlv{color:var(--muted);font-variant-numeric:tabular-nums}
  /* legend chips */
  .cat-legend{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
  .cat-chip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)}
  .cat-chip .dot{width:11px;height:11px;border-radius:3px}
  /* toast / modal */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--toast-bg);color:var(--toast-fg);padding:13px 22px;border-radius:11px;font-size:14px;
    box-shadow:var(--sh-lg);opacity:0;pointer-events:none;

    transform:scale(1.04);filter:saturate(1.15)}

  /* month view */
  .mo-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .mo-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:650;padding:2px 0}
  .mo-cell{border:1px solid var(--line);border-radius:10px;background:var(--card);
    min-height:66px;padding:5px 7px 6px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:1px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mo-cell:hover{border-color:var(--accent);box-shadow:var(--sh-sm)}
  .mo-cell.blank{border:none;background:none;cursor:default;box-shadow:none}
  .mo-cell.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .mo-cell .dn{font-size:11px;font-weight:650;color:var(--muted);align-self:flex-start}
  .mo-cell.today .dn{color:var(--accent-ink)}
  .mo-pie{display:block;margin:0 auto}
  /* health view */
  .hd-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    border-bottom:1px dashed var(--line);font-size:13px}
  .hd-row:last-child{border-bottom:none}
  .hd-date{width:96px;flex-shrink:0;color:var(--muted);font-weight:650;
    font-size:12px;padding-top:2px}
  .hd-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center}
  .hd-none{color:var(--faint)}
  .diet-chip{padding:2px 10px;border-radius:11px;font-size:12px;
    white-space:nowrap}
  /* health section dividers */
  .h-sec{font-size:15px;font-weight:800;color:var(--accent-ink);letter-spacing:1.5px;
    margin:26px 4px 12px;display:flex;align-items:center;gap:12px}
  .h-sec:first-child{margin-top:2px}
  .h-sec::after{content:"";flex:1;height:1px;background:var(--line)}
  /* Bohe-style comparison rows + star insights */
  .cmp-group{margin-bottom:12px}
  .cmp-title{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:4px}
  .cmp-row{display:flex;align-items:center;gap:8px;margin:3px 0}
  .cmp-lbl{width:40px;font-size:11px;color:var(--muted);flex-shrink:0}
  /* activity names are words, not dates: 力量训练 wrapped to 力量训 / 练
     against a 40px column while 40px of slack sat beside the bar */
  .cmp-lbl.wide{width:auto;max-width:44%;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .cmp-track{flex:1;height:12px;background:var(--well);border-radius:6px;overflow:hidden}
  .cmp-fill{height:100%;border-radius:6px;background:var(--accent)}
  .cmp-fill.prev{background:var(--muted);opacity:.5}
  .cmp-val{font-size:12px;font-weight:650;color:var(--ink);min-width:52px;
    text-align:right;flex-shrink:0;white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .cmp-val.muted{color:var(--faint);font-weight:400}
  .cmp-pair{display:flex;gap:22px;margin:10px 0 6px}
  .cp-k{font-size:11px;color:var(--muted)}
  .cp-v{font-size:16.5px;font-weight:750}
  .cp-p{font-size:11px;color:var(--muted)}
  .star-line{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;
    color:var(--ink);margin:7px 0 0;line-height:1.5}
  .star-line .st{flex-shrink:0;font-size:12px;color:var(--star)}
  /* Bohe body-metric delta */
  .wt-cmp{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .wt-pt .wt-v{font-size:21px;font-weight:800;line-height:1.1}
  .wt-pt .wt-d{font-size:11px;color:var(--muted)}
  .wt-arrow{flex:1;display:flex;align-items:center;justify-content:center;
    position:relative;height:22px}
  .wt-arrow::before{content:"";position:absolute;left:0;right:0;top:50%;
    border-top:1.5px dashed var(--line)}
  .wt-chip{position:relative;background:var(--well);color:var(--ink);
    font-size:11.5px;font-weight:700;padding:1px 10px;border-radius:11px}
  .sec-note{padding:2px 6px 10px;font-style:italic}
  /* butler weekly-review cards: quiet plain text */
  /* no white-space:pre-wrap — the newlines are paragraphs now, not spacing */
  .bw-text{font-size:13.5px;line-height:1.75;color:var(--ink)}
  .bw-wk{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:6px}
  /* 习惯实验: quiet display card — never a prompt, never a nudge */
  .hx-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hx-title{font-size:14px;font-weight:700;color:var(--ink)}
  .hx-chip{font-size:11px;font-weight:650;padding:1px 9px;border-radius:10px;
    background:var(--well);color:var(--muted)}
  .hx-chip.on{background:var(--accent-soft);color:var(--accent-ink)}
  .hx-body{font-size:13px;line-height:1.7;white-space:pre-wrap;color:var(--ink);
    margin-top:8px}
  .hx-past{padding:6px 0;border-bottom:1px dashed var(--line)}
  .hx-past:last-child{border-bottom:none}
  .hx-past-t{font-size:13px;font-weight:650}
  /* 洞察 per-section insight cards: quiet by default; a fresh one (<36h)
     gets an accent-tinted left edge drawn as an inset shadow so the card
     stays exactly as wide as its neighbours */
  .si-card.fresh{box-shadow:var(--card-sh),
    inset 3px 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}
  .si-card:not(.fresh) .bw-text{color:var(--muted)}
  .si-new{color:var(--accent-ink);margin-left:8px}
  .si-dot,.cl-dot{display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--accent);vertical-align:2px;margin-right:4px;flex-shrink:0}
  /* 更新日志: compact numbered ledger, industrial-muted */
  .cl-day{font-size:11.5px;font-weight:700;color:var(--faint);
    font-variant-numeric:tabular-nums;letter-spacing:.4px;margin:10px 0 2px}
  .cl-item{position:relative;display:flex;gap:6px;font-size:12px;
    color:var(--muted);line-height:1.7}
  .cl-item .cl-n{flex-shrink:0;color:var(--faint);font-variant-numeric:tabular-nums}
  .cl-item .cl-dot{position:absolute;left:-10px;top:8px;margin:0}
  /* late-intake marker on eating-window bars (fact, not judgment) */
  .dt-late{position:absolute;top:2px;width:6px;height:6px;border-radius:50%;
    background:#d9a520;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
  /* GitHub-style exercise intensity heatmap: weeks as columns */
  .ex-heat{display:flex;gap:4px}
  .ex-heat .col{display:flex;flex-direction:column;gap:4px}
  .ex-heat .cell{width:17px;height:17px;border-radius:4px;background:var(--well)}
  /* stats dashboard */
  .rng{padding:7px 18px;font-size:13.5px}
  .rng.active{background:var(--accent-fill);color:var(--accent-on);
    border-color:var(--accent-fill)}
  .rng.active:hover{color:#fff;background:var(--accent-2)}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:16px;grid-auto-flow:dense}
  /* a grid item's automatic minimum size is its MIN-CONTENT, so one long
     unbreakable value can drag its track — and the whole grid — past the
     container. Every card is allowed to be narrower than its content. */
  /* Two cards side by side are ONE row and stretch to the same height (the
     grid default). Shrink-to-content was what left a 165x200 void beside a
     taller neighbour: the gap was outside the short card, so nothing could
     fill it. Stretched, the room is inside the card, and short bodies are
     centred in it so it reads deliberate instead of empty. */
  .stat-grid>.card{min-width:0;min-height:0;display:flex;flex-direction:column}
  .stat-grid>.card>.sc-title{flex:0 0 auto}
  .stat-grid>.card>.sc-body,
  .stat-grid>.card>div:not(.sc-title){flex:1 1 auto;display:flex;
    flex-direction:column;justify-content:center}
  .stat-grid .card{margin-bottom:0}
  .sc-title{font-size:12.5px;font-weight:700;color:var(--muted);
    letter-spacing:.4px;margin-bottom:10px}
  .sc-big{font-size:30px;font-weight:800;color:var(--accent-ink);
    line-height:1.05;display:inline-block;white-space:nowrap}
  .sc-delta{font-size:13px;font-weight:650;margin-left:6px}
  .sc-delta.up,.sc-line.up{color:var(--accent-ink)}
  .sc-delta.down{color:var(--muted)}
  .sc-line{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.65}
  .sc-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0;
    border-bottom:1px dashed var(--line)}
  .sc-row:last-child{border-bottom:none}
  .sc-row .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .sc-row .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc-row .v{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  /* stacking opacity on --muted put the faint tier at 2.3:1 (light) and
     3.2:1 (dark). It is its own token now, at full strength. */
  .sc-empty,.faint{color:var(--faint);opacity:1;font-size:13px}
  .sc-line.faint{font-size:12.5px}
  /* a two-character category name split across lines orphaned 议 from 会 */
  .nw{white-space:nowrap}
  .ddl-add{font-size:12px;padding:4px 10px;border-radius:6px;flex-shrink:0}
  /* sparse fallback rows: date left, values wrap on the right so the card
     body is filled instead of reserving chart height for one sentence */
  .sc-sparse .sc-row{align-items:flex-start}
  .sc-sparse .sc-row .k{flex:0 0 46px;white-space:nowrap}
  .sc-sparse .sc-row .v{flex:1;min-width:0;text-align:right;color:var(--ink);
    white-space:normal;word-break:break-word}
  .sc-insight{font-style:italic;color:var(--muted);font-size:12.5px;
    line-height:1.5;margin-top:4px}
  .sc-ring{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  /* rhythm card day rows (sleep-app style) */
  .rh-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;
    border-bottom:1px dashed var(--line)}
  .rh-row:last-child{border-bottom:none}
  .rh-day{width:58px;flex-shrink:0;font-size:11.5px;color:var(--muted);
    font-weight:650;padding-top:1px;white-space:nowrap}
  .rh-qual{font-weight:500}
  .rh-main{flex:1;min-width:0}
  .rh-bar{position:relative;height:10px;background:var(--well);
    border-radius:5px;overflow:hidden}
  .rh-seg{position:absolute;top:0;bottom:0;border-radius:3px}
  .rh-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
  .rh-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
  .rh-nap{display:inline-block;padding:0 8px;border-radius:9px;
    background:var(--well);font-size:11px;color:var(--muted);margin-left:6px}
  /* week analysis */
  .wk-an{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .wk-an-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);
    font-size:13px;align-items:baseline}
  .wk-an-row:last-child{border-bottom:none}
  .wk-an-day{font-weight:650;color:var(--muted);width:88px;flex-shrink:0;font-size:12px;
    cursor:pointer}
  .wk-an-day:hover{color:var(--accent-ink)}
  .wk-an-go{margin-left:3px;color:var(--accent-ink);opacity:.7}
  .wk-an-main{flex:1;min-width:0}
  .wk-an-low{color:var(--faint)}
  .wk-an-insight{display:block;color:var(--muted);font-size:12px;
    margin-top:3px;font-style:italic;line-height:1.6;white-space:normal}
  /* memos */
  .memo-day{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px}
  /* 短期 / 长期 split: the long group is deliberately quiet — collapsed by
     default and muted when open, so months-away items never compete with
     what she has to do this week */
  .memo-sec{font-size:13px;font-weight:700;color:var(--ink);margin:0 0 2px}
  .memo-long{margin-top:12px;border-top:1px dashed var(--line)}
  .memo-long .memo-row,.memo-long .memo-day{color:var(--muted)}
  .memo-kind .rng{padding:7px 12px;font-size:13px}
  .memo-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;
    border-bottom:1px dashed var(--line);font-size:14px}
  .memo-row .m-tm{color:var(--muted);font-size:12px;flex-shrink:0;
    width:42px;padding-top:2px;font-variant-numeric:tabular-nums}
  .memo-row .m-tx{flex:1;white-space:pre-wrap;word-break:break-word}
  .memo-row .m-del{border:none;background:none;padding:2px 6px;font-size:14px;
    color:var(--muted);flex-shrink:0}
  .memo-row .m-del:hover{border:none;background:none;transform:none;
    box-shadow:none;color:var(--danger)}
  /* 未来两周: 左右各一条 7 天的时间轴 */
  /* Three-week month grid (her 2026-08-15 ask: "显示从 mon 开始的日历格式").
     A calendar shape reads faster than a list because the empty days keep
     their place — a free Thursday looks free. Meetings outrank deadlines
     visually: they are the ones she cannot move alone. */
  .mcal{display:grid;grid-template-columns:repeat(7,1fr);
    border-top:1px solid var(--line);border-left:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .mcal-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-align:center;
    color:var(--faint);padding:5px 2px;background:var(--card-2,transparent);
    border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .mcal-d{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    min-height:92px;padding:5px 5px 7px;position:relative}
  /* Past days dim their ink only. At .45 the day numbers measured 2.0:1 and
     a past meeting turned into a smudge; at .82 they read fine. The cell
     background stays free for the weekend tint — two cues on one channel made
     a past weekday look lighter than a future Saturday. */
  .mcal-d.past{opacity:.82}
  .mcal-d.wend{background:color-mix(in srgb,var(--line) 45%,transparent)}
  .mc-num{font-size:11.5px;font-weight:700;color:var(--muted);
    font-variant-numeric:tabular-nums;line-height:18px;display:block;margin-bottom:3px}
  /* dark ink on the mint pill — white on mint was 2.3:1, the faintest text
     in the block, and mint stays light in both themes */
  .mcal-d.today .mc-num{color:#08312a;background:var(--accent);width:18px;height:18px;
    border-radius:999px;text-align:center}
  .mc-num i{font-style:normal;font-weight:600;color:var(--faint);margin-left:3px}
  /* a meeting: full-strength ink, bold clock, its own accent bar */
  .mc-mt{font-size:11.5px;line-height:1.35;color:var(--ink);font-weight:600;
    border-left:2px solid var(--accent);padding-left:4px;margin-bottom:3px;
    word-break:break-word}
  .mc-mt b{font-variant-numeric:tabular-nums;color:var(--accent-ink);margin-right:2px}
  /* a deadline: same day, lower voice */
  .mc-ddl{font-size:10.5px;line-height:1.3;color:var(--warn-fg);margin-bottom:2px;
    word-break:break-word}
  .mc-mark{font-size:10.5px;line-height:1.3;color:var(--faint);margin-bottom:2px;
    word-break:break-word;padding-left:11px;text-indent:-11px}
  .mc-cls{font-size:10.5px;color:var(--faint)}
  .mc-dots{display:none;gap:3px;margin-top:2px}
  .mc-dots i{width:5px;height:5px;border-radius:999px;background:var(--accent);display:block}
  .mc-dots i.d{background:var(--warn-fg)}
  .mc-dots i.m{background:transparent;border:1px solid var(--faint)}
  .mcal-list{display:none;margin-top:10px}
  .mcl-day{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  .mcl-day.past{opacity:.82}
  .mcl-day:first-child{border-top:none}
  .mcl-dt{flex:0 0 52px;font-size:11.5px;font-weight:700;color:var(--accent-ink);
    font-variant-numeric:tabular-nums;padding-top:1px}
  .mcl-body{flex:1;min-width:0}
  /* Phone: the grid keeps the calendar shape (every day still has its box)
     but drops to dots; the detail moves to a list underneath, where there is
     room for a full meeting title. */
  @media(max-width:640px){
    .mcal-d{min-height:44px;padding:3px 2px 4px}
    .mcal-d .mc-mt,.mcal-d .mc-ddl,.mcal-d .mc-mark,.mcal-d .mc-cls{display:none}
    .mc-num{font-size:10.5px;text-align:center;margin-bottom:2px}
    .mcal-d.today .mc-num{margin:0 auto 2px}
    .mc-dots{display:flex;justify-content:center}
    .mcal-list{display:block}
  }
  /* todos */
  .todo-row{display:flex;gap:10px;align-items:center;padding:9px 6px;
    border-bottom:1px dashed var(--line);font-size:14px}
  .todo-row input[type=checkbox]{width:17px;height:17px;flex-shrink:0;
    margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
  .todo-row .td-title{flex:1;word-break:break-word}
  .todo-row:last-child{border-bottom:none}
  .todo-row.overdue{background:var(--danger-soft);border-radius:6px}
  .todo-row.done .td-title{text-decoration:line-through;color:var(--muted)}
  .td-due{font-size:12px;color:var(--muted);flex-shrink:0;
    font-variant-numeric:tabular-nums}
  .td-due.late{color:var(--danger);font-weight:700}
  /* detail drawer */
  #detail{position:fixed;inset:0;z-index:150;display:flex;align-items:center;
    justify-content:center;background:rgba(7,18,55,.38);padding:20px}
  #detail .d-card{background:var(--card);
    border:1px solid var(--card-bd);border-radius:var(--r-m);
    padding:22px 24px;width:360px;max-width:92vw;box-shadow:var(--sh-lg)}
  #detail .d-name{font-weight:700;font-size:16px;margin-bottom:4px}
  #detail .d-meta{color:var(--muted);font-size:12.5px;line-height:1.6}
  /* ---- meeting minutes: link in the drawer + full-text reader --------- */
  .mn-link{display:inline-block;margin:0 0 12px;font-size:13px;font-weight:600;
    color:var(--accent-ink);text-decoration:none;
    border:1px solid var(--card-bd);border-radius:8px;padding:6px 10px}
  #minutes{position:fixed;inset:0;z-index:160;display:flex;align-items:center;
    justify-content:center;background:rgba(7,18,55,.42);padding:16px}
  #minutes .mn-card{background:var(--card);border:1px solid var(--card-bd);
    border-radius:var(--r-m);box-shadow:var(--sh-lg);
    width:720px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column}
  #minutes .mn-head{display:flex;align-items:center;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--card-bd);
    font-weight:700;font-size:15px}
  #minutes .mn-head>span:first-child{flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #minutes .mn-tabs{display:flex;gap:0;border:1px solid var(--card-bd);
    border-radius:8px;overflow:hidden;flex:0 0 auto}
  #minutes .mn-tabs button{border:0;border-radius:0;min-height:0;
    padding:5px 11px;font-size:12.5px;font-weight:600;
    background:transparent;color:var(--muted)}
  #minutes .mn-tabs button.on{background:var(--accent);color:#fff}
  /* a tab that does nothing when tapped reads as a broken button — say so */
  #minutes .mn-tabs button:disabled{opacity:.35;cursor:default}
  /* a meeting transcript is prose, not code: monospace at 13px made a wall
     of Chinese unreadable. System text face, generous leading, and a line
     length capped near 40 characters. */
  #minutes #mn-body{margin:0;padding:20px 22px 28px;overflow:auto;flex:1;
    font-size:15.5px;line-height:2;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
      "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
  #minutes #mn-body>p{margin:0 0 1.05em;max-width:40em}
  #minutes .mn-pair{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;
    align-items:start}
  #minutes .mn-pair>div{padding:5px 0;border-bottom:1px solid var(--line);
    font-size:13px;line-height:1.6;word-break:break-word}
  #minutes .mn-pair>div.zh{color:var(--ink)}
  #minutes .mn-pair>div.en{color:var(--muted)}
  @media(max-width:620px){
    #minutes .mn-pair{grid-template-columns:1fr;gap:0}
    #minutes .mn-pair>div.en{border-bottom:0;padding-bottom:0}
    #minutes .mn-pair>div.zh{padding-top:1px}
  }
  #minutes .mn-raw{white-space:pre-wrap;word-break:break-word;
    color:var(--muted-ink,var(--ink));max-width:40em}
  #minutes .mn-spk{display:inline-block;margin-right:8px;padding:1px 8px;
    border-radius:999px;font-size:12.5px;font-weight:700;
    background:var(--accent-soft,rgba(0,0,0,.06));color:var(--accent-ink)}
  #minutes mark{background:var(--mark-bg,#ffe9a8);color:inherit;
    padding:0 2px;border-radius:3px}
  #minutes #mn-body .mn-h{font-weight:800;font-size:16px;margin:1.4em 0 .5em;
    color:var(--accent-ink)}
  .tlb-doc{position:absolute;top:2px;right:4px;font-size:10px;opacity:.85}
  /* ---- chart info popover (hover on desktop, tap on touch) -----------
     ONE floating card for every chart: theme tokens only, capped width,
     flips above the anchor when the bottom is cramped. z-index below the
     detail drawer (150) so an open drawer always wins. */
  .pv{position:fixed;z-index:140;max-width:280px;
    background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--sh-lg);padding:10px 13px;
    font-size:12.5px;line-height:1.55}
  .pv .pv-t{font-weight:700;font-size:13px;margin-bottom:5px}
  .pv .pv-row{display:flex;gap:12px;justify-content:space-between;
    align-items:baseline}
  .pv .pv-k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .pv .pv-v{color:var(--muted);font-variant-numeric:tabular-nums;
    flex-shrink:0;white-space:nowrap}
  .pv .pv-line{color:var(--muted)}
  .pv .pv-note{color:var(--muted);margin-top:4px;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .pv .pv-go{display:inline-block;margin-top:7px;color:var(--accent-ink);
    font-weight:650;cursor:pointer}
  .pv .pv-dot{display:inline-block;width:9px;height:9px;border-radius:3px;
    margin-right:6px;flex-shrink:0;vertical-align:-1px}
  /* anchors invite a tap; timeline blocks keep their grab cursor */
  [data-pv]:not(.tlb){cursor:pointer}
  @media(max-width:680px){.grid,.stats-cards{grid-template-columns:1fr}
    .hero-tools{position:static;margin-top:14px}.hero{padding:22px}
    .bar-row .lab{width:92px}
    .tlb-resize{height:14px}} /* fatter touch target on phones */

  /* ---- 成就阅览室 — the tab itself. An album she wanders into to feel
     good, not a report: a soft tinted welcome card with the cumulative
     count, then day-grouped keepsake cards. Milestones (★, butler-awarded)
     sit a touch more ornate than checked suggestions (✔). */
  .ach-hello{background:linear-gradient(135deg,var(--accent-soft),var(--well-soft));
    border-color:var(--line);text-align:center;padding:30px 24px 26px}
  .ach-greet{font-size:14px;color:var(--muted);letter-spacing:.4px}
  .ach-num{font-size:44px;font-weight:800;color:var(--accent-ink);
    line-height:1.15;margin-top:4px}
  .ach-num .ach-unit{font-size:14px;font-weight:600;color:var(--muted);
    margin-left:7px;letter-spacing:.3px}
  .ach-stars{margin-top:6px;font-size:15px;letter-spacing:7px;color:var(--star)}
  .ach-stars .off{opacity:.22}
  .ach-day{font-size:12.5px;font-weight:650;color:var(--faint);
    letter-spacing:.4px;margin:22px 6px 8px}
  .ach-feed>.ach-day:first-child{margin-top:6px}
  .ach-item{display:flex;gap:11px;align-items:flex-start;
    background:var(--card-bg);border:1px solid var(--card-bd);
    border-radius:var(--r-m);box-shadow:var(--sh-sm);
    padding:14px 17px;margin-bottom:10px;
    animation:rise .42s var(--ease) both}
  /* every shelf item wears a GOLD star (her spec); the ones she checked
     off herself carry a tiny ✔ badge on the star to tell them apart from
     butler-awarded milestones */
  .ach-mk{flex:0 0 auto;width:20px;text-align:center;line-height:1.6;
    color:var(--star)}
  .ach-mk.done-star{position:relative}
  .ach-mk.done-star i{position:absolute;right:-5px;bottom:1px;
    font-style:normal;font-size:9px;line-height:1;font-weight:800;
    color:var(--badge-ok)}
  .ach-item.ms{background:linear-gradient(135deg,var(--accent-soft),var(--card-bg) 55%)}
  .ach-txt{flex:1;min-width:0;font-size:14px;line-height:1.6;
    overflow-wrap:anywhere}
  .ach-empty{text-align:center;color:var(--muted);font-size:13.5px;
    padding:28px 0}

  /* ===================================================================
     PHONE DENSITY LAYER (≤430px). Desktop must render identically to
     before, so every rule here lives inside this query. Mobile is not
     "desktop stacked": tighter shell, 6-step type scale, 2-up stat
     grid, compact timeline metrics.
     =================================================================== */
  @media(max-width:430px){
    :root{--r-m:14px;--r-l:16px;--r-s:8px}
    .wrap{padding:10px 12px 40px}
    /* 1. hero: was ~805px of an 844px viewport on every tab */
    .hero{padding:14px 16px 16px;margin-bottom:12px;border-radius:var(--r-m)}
    .hero h1{font-size:22px;letter-spacing:1px;gap:8px}
    .hero h1 svg{width:28px;height:28px}
    .hero .tagline,.hero #buildStamp{display:none}
    .hero-tools{position:static;margin:0 0 10px;justify-content:flex-end}
    .hero-tools button{min-height:44px;min-width:44px;padding:6px 14px}
    .hero::after,.hero::before{display:none}
    .insight-card{margin-top:10px;padding:10px 12px}
    .insight-card .iv{font-size:13px;line-height:1.55}
    .ia-list{margin-top:10px;padding-top:8px}
    .ia-txt{font-size:13px}
    .ach-link{min-height:44px;display:inline-flex;align-items:center}
    /* 成就 tab keeps the album feel at phone density, just tighter */
    .ach-hello{padding:20px 16px 18px}
    .ach-num{font-size:34px}
    .ach-day{margin:16px 4px 6px;font-size:12px}
    .ach-item{padding:12px 13px;margin-bottom:8px}
    .ach-txt{font-size:13px}
    /* the body is paragraphs now, and -webkit-line-clamp counts child
       boxes once the box has block children — it would collapse a 6-block
       insight to 3 whole paragraphs. A height cap of three line-heights
       collapses to the same 3 lines whatever the prose is split into. */
    .insight-card .iv.clamp{max-height:4.65em;overflow:hidden}
    /* phones: same rhythm, tighter, so a 6-paragraph insight does not turn
       the hero into a full screen */
    .prose>*+*{margin-top:.5em}
    .prose>*+.prose-h{margin-top:.8em}
    .prose+.prose{margin-top:.5em}
    /* follows the hero ink like every other element on that card — it was
       still hard-coded white from when --hero-fg was white */
    .ins-more{background:none;border:none;padding:4px 0 0;color:var(--hero-fg);
      opacity:1;font-size:12px;text-decoration:underline;min-height:0}
    .ins-more:hover{background:none;border:none;color:var(--hero-fg);
      transform:none;box-shadow:none}
    /* 2. tab bar: was 3 wrapped rows (~150px) that scrolled away */
    .tabs{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
      position:sticky;top:0;z-index:60;margin:0 -12px 12px;padding:0 12px;
      background:color-mix(in srgb,var(--pg-base) 82%,transparent);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
    .tabs::-webkit-scrollbar{display:none}
    /* a label sliced mid-glyph at the edge read as a rendering bug; fade
       it instead, which also says "there is more this way" */
    .tabs{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%);
      mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 26px),transparent 100%)}
    .tab{padding:10px 12px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
    .tabs-line{display:none}
    /* 4. shell padding — body text width 298→338px */
    .card{padding:12px 14px 14px;margin-bottom:12px;border-radius:var(--r-m)}
    .stat-grid{gap:10px}
    /* 6-step type scale */
    .sc-title{font-size:12px;margin-bottom:8px}
    .sc-big,.stat .n{font-size:24px}
    .sc-line,.sc-row,.sc-empty{font-size:12px}
    .chart-title{font-size:13px;margin-bottom:12px}
    /* 3. month grid overflowed the page (420 vs 390) */
    .mo-grid{gap:4px}
    .mo-cell{min-width:0;min-height:52px;padding:4px 2px;border-radius:8px}
    .mo-cell .dn{font-size:10px}
    .mo-dow{font-size:10px}
    /* 9. stats: minmax(270) could never fit two columns in 298px. Explicit
       two columns, not auto-fit — `grid-column:1/-1` has to mean "the whole
       row" for the orphan-card fitter, and with an auto-repeat track list
       that is not something to bet a layout on. */
    /* minmax(0,1fr), NOT 1fr: plain `1fr` is minmax(auto,1fr), whose auto
       minimum lets a card's min-content push the track wider than the
       container — 10g overflowed to 502pt and pushed the donut legend's
       second column off-screen. A 0 minimum pins both columns to exactly
       half the container and makes content shrink instead. */
    /* Pairing a one-line card with a chart card was the void, in BOTH
       directions: shrink-to-content left it beside the card, stretch left
       it inside. So stop pairing them. A card that draws a chart, a list
       or a breakdown takes the whole row, where short is simply short and
       there is no neighbour to match. Only cards that are naturally one
       number tall stay two-up — they are already equal height. */
    .stat-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .stat-grid>.card{grid-column:1/-1}
    .stat-grid>.card.sc-compact{grid-column:auto}
    /* item 6: legend beside the donut was 1 column of 9 rows (~285px).
       The card spans both grid columns so the 2-column legend has room —
       at half width the category names clipped to "睡·". */
    .sc-card-wide{grid-column:1/-1}
    .sc-legend{columns:2;column-gap:14px}
    .sc-legend .sc-row{break-inside:avoid;border-bottom:none;padding:3px 0;font-size:11.5px}
    /* item 7 folded the tool row onto the title line, reserving 150px. The
       row is five 40px buttons wide (~232px) once signed in, so it sat on top
       of 时间记录 — it keeps its own line instead. */
    .hero{display:flex;flex-direction:column}
    .hero h1{order:1}
    .hero-tools{order:0;position:static;margin:0 0 8px;justify-content:flex-end}
    .hero-tools button{min-height:40px;min-width:40px;padding:6px 10px;font-size:12.5px}
    .hero .insight-card{order:2}
    /* item 9: the 164px rule never applied — the input carried an INLINE
       flex:1;min-width:140px that outranks any stylesheet rule, so the
       field stayed 148.7px (336px body − 160px title − 10px gap, grown 2:1)
       and the native mm/dd/yyyy placeholder needs ~101px on top of the
       ~20px picker glyph inside a 119.7px content box. The inline styles
       are gone; on phones the title takes its own row and the date field
       shares row 2 with 添加 → 336 − 10 − ~67 = ~259px outer, ~212px of
       text room for a ~101px placeholder. */
    #todo-title{flex:1 1 100%}
    #todo-due{flex:1 1 auto;min-width:0}
    .card.fold-card{padding:2px 14px}
    /* item 5: a trailing card alone on the last row of the 2-up grid left
       ~190×225px of dead space beside it. fillCard() hides empty cards with
       a class, so :nth-child parity cannot see the real layout — the last
       VISIBLE card is tagged in JS (fitStatGrids). */
    .stat-grid>.card.span2{grid-column:1/-1}   /* lone compact card */
    /* item 15: 44px hit areas without changing the visual size */
    .kt-sum{position:relative;min-height:44px;align-items:center}
    .ins-more{min-height:44px}
    .card-link{min-height:44px;display:flex;align-items:center}
    .stats-cards{grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:12px 12px}
    /* 10. donut card was 382px */
    .donut{width:110px;height:110px;margin:0 auto}
    .donut-wrap{flex-direction:column;gap:10px}
    .donut-legend{width:100%;columns:2;column-gap:12px}
    .dl-row{font-size:11.5px;margin-bottom:4px;break-inside:avoid}
    .sc-ring{gap:10px;justify-content:center}
    /* 13. block labels: parallel strips were 83px */
    .tlb{font-size:11px}
    .tlb.par{width:45%}
    .tlb .tmt,.tlb .tnt{font-size:10px}
    .tlb{padding-right:12px}          /* item 10: keep text clear of the dot */
    /* 19. touch targets */
    /* collapsed 图例 kept the open legend's 14px bottom margin under a
       44px hit area — ~40px of nothing on 今天/本周/本月 */
    .cat-legend{margin-bottom:0;gap:8px}
    .cat-legend>.kt-wrap>.kt-sum{min-height:40px}
    .cal-nav button{min-height:44px;min-width:44px;padding:6px 12px}
    .rng{min-height:44px;padding:8px 16px}
    .todo-row input[type=checkbox]{position:relative}
    .todo-row input[type=checkbox]::before{content:"";position:absolute;
      left:-13px;top:-13px;width:44px;height:44px}
    /* 17. todo rows: date collided with wrapped titles */
    .todo-row{flex-wrap:wrap;padding:10px 4px}
    .todo-row .td-title{flex:1 1 auto;min-width:0}
    .todo-row .td-due{flex:0 0 100%;margin-left:27px;font-size:12px;
      color:var(--muted);margin-top:2px}
    /* 16. record form: 8 stacked groups = 1024px */
    #tab-add .grid{grid-template-columns:1fr 1fr;gap:10px}
    #tab-add .field{margin-bottom:10px}
    #tab-add .formfoot button{width:100%;min-height:48px}
    /* 15/14: compact review + orphan-card links */
    /* the native date control took ~150px out of a 336px row and squeezed
       the 时间空缺 hint into 3 lines — it gets its own line on phones */
    .rev-head{gap:8px;flex-wrap:wrap}
    .rev-head>div{flex:1 1 100%;min-width:0}
    .rev-head #review-date{flex:1 1 100%;width:100%}
    .rev-hint{font-size:11.5px}
    .card-link{display:block;padding:8px 0 0;font-size:12.5px;
      color:var(--accent-ink);font-weight:600}
    .memo-row,.hd-row{font-size:12.5px}
    /* week compact rows (item 7) */
    .wk-mini{display:flex;align-items:center;gap:8px;padding:7px 2px;
      border-bottom:1px dashed var(--line);cursor:pointer;min-height:44px}
    .wk-mini:last-child{border-bottom:none}
    .wk-mini .wm-d{width:62px;flex-shrink:0;font-size:11.5px;font-weight:650;
      color:var(--muted);white-space:nowrap}   /* 08-03 周一 wrapped to 周/一 */
    .wk-mini.today .wm-d{color:var(--accent-ink)}
    /* the mask forces the rounded clip to apply to the segment children —
       without it WebKit let the last segment paint a ~2px crescent past
       the right end cap */
    .wk-mini .wm-bar{flex:1;height:12px;border-radius:6px;overflow:hidden;
      display:flex;background:var(--well);min-width:0;
      -webkit-mask-image:-webkit-radial-gradient(#fff,#fff);
      mask-image:radial-gradient(#fff,#fff)}
    .wk-mini .wm-seg{height:100%}
    .wk-mini .wm-t{width:44px;text-align:right;flex-shrink:0;font-size:11.5px;
      color:var(--ink);font-variant-numeric:tabular-nums}
    /* an unlabelled full-length grey track read the same as a 1h sliver */
    /* was var(--muted) at .7 opacity = 3.95:1 in dark; full-strength ink
       at .78 clears 4.5:1 in both themes */
    .wk-mini .wm-t.none{color:var(--ink);opacity:.78;font-size:10.5px}
    .wk-mini .wm-go{flex-shrink:0;color:var(--accent-ink);opacity:.75;
      font-size:13px}
  }
</style>
</head>
<body>
<div id="authGate" class="hidden">
  <div class="auth-card">
    <div class="auth-logo"><img src="icon.svg" alt="" width="52" height="52"
      style="border-radius:13px;vertical-align:middle"
      onerror="this.style.display='none'"></div>
    <div class="auth-title" data-i18n="auth.title"></div>
    <div class="auth-note" data-i18n="auth.note"></div>
    <input id="au-email" type="email" data-ph="auth.email" autocomplete="username">
    <input id="au-pw" type="password" data-ph="auth.pw" autocomplete="current-password">
    <button class="primary" data-i18n="auth.signIn" onclick="doSignIn()"></button>
    <button data-i18n="auth.signUp" onclick="doSignUp()"></button>
  </div>
</div>
<div class="wrap">
  <div class="hero">
    <div class="hero-tools">
      <button id="syslogBtn" onclick="openSyslog()" title="管家日志">📋</button>
      <button id="refreshBtn" onclick="doRefresh()" title="refresh"><span class="rg">↻</span></button>
      <button id="themeBtn" onclick="cycleTheme()" title="auto / light / dark">◐</button>
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">中</button>
      <button id="loginBtn" class="hidden" data-i18n="auth.signIn" onclick="openAuthGate()"></button>
      <button id="signOutBtn" class="hidden" data-i18n="signOut" onclick="doSignOut()"></button>
    </div>
    <h1><svg viewBox="0 0 256 256" width="36" height="36" style="flex-shrink:0;border-radius:9px">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7DDEBB"/><stop offset="1" stop-color="#5BC9A5"/></linearGradient></defs>
      <rect width="256" height="256" rx="58" fill="url(#hg)"/>
      <path fill="#fff" opacity=".9" d="M192 54c2-20 17-33 37-33-2 20-17 33-37 33z"/>
      <path fill="#fff" opacity=".65" d="M215 76c1-15 12-25 27-25-1 15-12 25-27 25z"/>
      <rect x="76" y="50" width="12" height="30" rx="6" fill="#fff"/>
      <rect x="144" y="50" width="12" height="30" rx="6" fill="#fff"/>
      <rect x="46" y="64" width="140" height="120" rx="16" fill="#fff"/>
      <rect x="46" y="64" width="140" height="34" rx="16" fill="#DFF5EC"/>
      <rect x="46" y="82" width="140" height="16" fill="#DFF5EC"/>
      <rect x="62" y="108" width="28" height="28" rx="7" fill="#E3F6ED"/>
      <rect x="102" y="108" width="28" height="28" rx="7" fill="#E3F6ED"/>
      <rect x="142" y="108" width="28" height="28" rx="7" fill="#E3F6ED"/>
      <rect x="62" y="144" width="28" height="28" rx="7" fill="#E3F6ED"/>
      <rect x="102" y="144" width="28" height="28" rx="7" fill="#4CBF97"/>
      <path d="M109 158l6 6 12-12" stroke="#fff" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="176" cy="180" r="48" fill="#fff"/>
      <circle cx="176" cy="180" r="38" fill="#EAF9F2"/>
      <path d="M176 180L196 168" stroke="#2E8F6F" stroke-width="6" stroke-linecap="round"/>
      <path d="M176 180L162 170" stroke="#2E8F6F" stroke-width="6" stroke-linecap="round"/>
      <circle cx="176" cy="180" r="4.5" fill="#2E8F6F"/>
    </svg> <span data-i18n="brand"></span></h1>
    <p class="tagline" data-i18n="tagline"></p>
    <p id="buildStamp" style="margin:2px 0 0;font-size:11px;opacity:.5"></p>
    <div id="insightCard" class="insight-card hidden">
      <div class="ik" data-i18n="insight.title"></div>
      <div class="iv" id="insightText"></div>
      <button id="insMore" class="ins-more hidden" onclick="toggleInsight()"></button>
      <div id="actBox"></div>
      <div id="cmtBox"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="today" data-i18n="tab.today" onclick="switchTab('today')"></button>
    <button class="tab" data-tab="week" data-i18n="tab.week" onclick="switchTab('week')"></button>
    <button class="tab" data-tab="month" data-i18n="tab.month" onclick="switchTab('month')"></button>
    <button class="tab" data-tab="stat" data-i18n="tab.stat" onclick="switchTab('stat')"></button>
    <button class="tab" data-tab="todo" data-i18n="tab.todo" onclick="switchTab('todo')">
      <span id="todoBadge" class="rev-badge hidden">0</span></button>
    <button class="tab" data-tab="spend" data-i18n="tab.spend" onclick="switchTab('spend')"></button>
    <button class="tab" data-tab="sleep" data-i18n="tab.sleep" onclick="switchTab('sleep')"></button>
    <button class="tab" data-tab="diet" data-i18n="tab.diet" onclick="switchTab('diet')"></button>
    <button class="tab" data-tab="sport" data-i18n="tab.sport" onclick="switchTab('sport')"></button>
    <button class="tab" data-tab="add" data-i18n="tab.add" onclick="switchTab('add')"></button>
    <button class="tab" data-tab="review" data-i18n="tab.review" onclick="switchTab('review')">
      <span id="reviewBadge" class="rev-badge hidden">0</span></button>

  <div class="tabs-line"></div>

  <section id="tab-today">
    <div class="card si-card hidden"><div id="siBoxToday"></div></div>

        <span class="plan-sum" id="planSum"></span></div>
      <div id="planBox"></div></div>

      <div class="cat-legend" id="catLegend"></div>
      <div id="todayBox"></div>
    </div>
    <div class="card hidden" id="dayHistCard"><div id="dayHistBox"></div></div>
  </section>

  <section id="tab-week" class="hidden">
    <div class="card bw-card"><div class="sc-title"><span data-i18n="bw.overall"></span>
        <span class="bw-wk" id="bwWeekWk"></span></div>
      <div id="bwWeekBox"></div></div>
    <div class="card si-card hidden"><div id="siBoxWeek"></div></div>
    <div class="card hx-card" id="hxWeekCard"><div id="hxWeekBox"></div></div>
    <div class="card">
      <div class="cat-legend" id="catLegendW"></div>
      <div id="weekBox"></div>
    </div>
  </section>

  <section id="tab-month" class="hidden">
    <div class="card si-card hidden"><div id="siBoxMonth"></div></div>
    <div class="card">
      <div class="cat-legend" id="catLegendM"></div>
      <div id="monthBox"></div>
    </div>
  </section>

  <section id="tab-stat" class="hidden">
    <div class="card si-card hidden"><div id="siBoxStat"></div></div>
    <div class="card" style="padding:12px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="rng" id="rng-d" onclick="setStatRange('d')" data-i18n="stat.rd"></button>
      <button class="rng" id="rng-w" onclick="setStatRange('w')" data-i18n="stat.rw"></button>
      <button class="rng" id="rng-m" onclick="setStatRange('m')" data-i18n="stat.rm"></button>
      <span id="statDayNav" class="hidden" style="display:flex;gap:6px;align-items:center;margin-left:8px">
        <button onclick="shiftStatDay(-1)">‹</button>
        <span id="statDayLbl" style="font-size:13.5px;font-weight:650"></span>
        <button onclick="shiftStatDay(1)">›</button>
      </span>
    </div>
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <section id="tab-review" class="hidden">
    <div class="card">
      <div class="rev-head">
        <div>
          <h3 data-i18n="review.problems.title"></h3>
          <div class="rev-hint" data-i18n="review.problems.hint"></div>
        </div>

// her ruling 2026-08-13: 会议/工作/学习 are one 正业 bloc — keep them
// CONTIGUOUS so every ring draws them as one continuous run
const CATS=['meeting','work','study','growth','sleep','exercise','commute','eat','leisure','idle','care','other'];
const CAT_COLOR={
  meeting:'#8b7dd8', work:'#2563eb', study:'#0ea5e9', sleep:'#94a3b8',
  growth:'#0f766e',   // deep teal: distinct from work/study blues and
                      // exercise green; white label text ≈5.4:1 contrast
    exercise:'#22a06b', commute:'#d9a520', eat:'#ef8354',
  // her 2026-08-15 split: 摸鱼 keeps the pink it has always had, 休闲 moves to
  // a lime that shares no hue with it — the whole point is telling the two
  // apart at a glance on a dense day
  leisure:'#84cc16', idle:'#e879a9',
  care:'#7dd3fc',     // 个护 — never drawn as a block, but rings and stats
                      // still need a colour for it

  other:'#a98467'     // warm tan — clearly apart from cool sleep gray-blue
};
// (commute nudged gold so it can't be confused with eat's coral)
function catColor(c){return CAT_COLOR[c]||CAT_COLOR.other}
// A label on a coloured fill picks the ink that actually reads on it —
// white on the dark categories, near-black on 办事/吃饭/睡觉. Scrimming
// every fill grey would have cost the palette its whole point.
const _srgb=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)};
function relLum(hex){
  const n=String(hex).replace('#','');
  return 0.2126*_srgb(parseInt(n.slice(0,2),16))
    +0.7152*_srgb(parseInt(n.slice(2,4),16))
    +0.0722*_srgb(parseInt(n.slice(4,6),16));
}
const INK_DARK='#08231c';
function inkOn(hex){
  const L=relLum(hex);
  return (1.05/(L+0.05))>=((L+0.05)/(relLum(INK_DARK)+0.05))?'#ffffff':INK_DARK;
}
// label lookups must NEVER leak raw i18n keys (the "ty." class of bug):
// when the dictionary misses, fall back to the raw value or Other
function catLabel(c){
  const k='cat.'+(c||'other');
  const s=t(k);
  return s===k?(c||t('cat.other')):s;
}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}

// ---- day/night theme --------------------------------------------------
// mode: 'auto' (default; light 07:00–19:59, dark 20:00–06:59) | 'light' | 'dark'
const TKEY='timelog.theme';
let THEME_MODE=localStorage.getItem(TKEY)||'auto';
function resolvedTheme(){
  if(THEME_MODE==='light'||THEME_MODE==='dark')return THEME_MODE;
  const h=new Date().getHours();
  return (h>=7&&h<20)?'light':'dark';
}
function applyTheme(){
  const th=resolvedTheme();
  const prev=document.documentElement.dataset.theme;
  document.documentElement.dataset.theme=th;
  const b=document.getElementById('themeBtn');
  if(b)b.textContent=THEME_MODE==='auto'?'◐':(THEME_MODE==='light'?'☀':'☾');
  // JS-drawn colors (health SVG, donut, month pies) read CSS vars → re-render
  if(prev&&prev!==th)renderActive();
}
function cycleTheme(){
  THEME_MODE=THEME_MODE==='auto'?'light':(THEME_MODE==='light'?'dark':'auto');
  localStorage.setItem(TKEY,THEME_MODE);
  applyTheme();
}

function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k]);if(s==null)s=k;
  if(v)for(const p in v)s=s.replace('{'+p+'}',v[p]);return s;}
function applyLang(){
  document.documentElement.lang=LANG;
  document.getElementById('langBtn').textContent=LANG==='zh'?'EN':'中';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  // rebuild category dropdown labels
  const sel=document.getElementById('f-category');
  if(sel){const cur=sel.value;
    sel.innerHTML=CATS.map(c=>`<option value="${c}">${esc(catLabel(c))}</option>`).join('');
    sel.value=cur||'work';}
  // kaileme-mode preview text depends on i18n
  if(document.getElementById('kmPreview'))syncKmPreview();
  renderActions();   // 今日建议 title + archive label live outside data-i18n
  renderHeroComments();   // 留言 placeholder + 发送 live outside data-i18n too
  renderActive();
}
function toggleLang(){LANG=LANG==='zh'?'en':'zh';localStorage.setItem(LKEY,LANG);applyLang();}
function esc(s){return(s||'').replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// ---- insight / assessment prose ---------------------------------------
// daily_reviews.insight and weekly_reviews.data.* are PLAIN TEXT written by
// the nightly butler: a blank line breaks a paragraph, a single newline is a
// line break, and a short line that ends with no sentence punctuation is a
// subheading. Markdown was never the contract, so ** / __ are STRIPPED
// (bold when they pair up cleanly), not parsed — no parser is wanted here.
// Everything is escaped first, so stored text can never inject markup.
const _PROSE_PUNCT=/[。．！？!?.；;：:]$/;
const PROSE_HEAD_MAX=16;   // 给自己一个"下班动作" is 11
function proseFlat(s){     // one line, markers gone — for compact rows
  return String(s==null?'':s).replace(/\*\*|__/g,'').replace(/\s+/g,' ').trim();
}
function proseInline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+)__/g,'<strong>$1</strong>')
    .replace(/\*\*|__/g,'');   // unpaired leftovers never reach the screen
}
function proseHtml(txt){
  const src=String(txt==null?'':txt).replace(/\r\n?/g,'\n');
  const paras=src.split(/\n[ \t]*\n+/).map(p=>p.trim()).filter(Boolean);
  if(!paras.length)return '';
  return '<div class="prose">'+paras.map(p=>{
    const bare=p.replace(/\*\*|__/g,'').trim();
    const head=bare.indexOf('\n')<0&&bare.length<PROSE_HEAD_MAX
      &&!_PROSE_PUNCT.test(bare);
    const body=p.split('\n').map(l=>proseInline(l.trim())).join('<br>');
    return `<div class="prose-${head?'h':'p'}">${body}</div>`;
  }).join('')+'</div>';
}
function lDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
  +'-'+String(d.getDate()).padStart(2,'0')}
function _hm2min(hm){if(!hm)return null;const[h,m]=hm.split(':').map(Number);return h*60+m}
// ONE date formatter for everything the app renders itself. `8/3 周一`,
// `8/3–8/9`, `8月8日` and `2026-08-03` all named the same day on one
// screen; the app speaks MM-DD, and YYYY-MM-DD when a range carries the
// year. Native <input type=date> keeps whatever the OS draws.
function md(x){
  if(x==null||x==='')return '';
  if(x instanceof Date)return String(x.getMonth()+1).padStart(2,'0')
    +'-'+String(x.getDate()).padStart(2,'0');
  return String(x).slice(5,10);
}
const mdRange=(a,b)=>md(a)+'–'+md(b);
// always one decimal: `办事 3h` beside `19.7h · 2.2h · 0.2h` read like a
// different quantity, not a rounder one
function fmtHours(h){if(h==null||isNaN(h)||h<=0)return '0h';
  return (Math.round(h*10)/10).toFixed(1)+'h';}

let _tT;
function toast(msg,kind){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(kind?' '+kind:'');

// ---- chart info popover -----------------------------------------------
// ONE mechanism for every chart: desktop hover previews, tap pins (touch
// only ever pins — pointerover is gated to real mice). Content is
// registered per render scope: a renderer re-registers its scope on every
// render, so the ids in fresh DOM always resolve and stale scopes are
// overwritten, never accumulated. data-pv = content id; data-pvh marks
// hover-only anchors (今天 timeline blocks, whose tap must keep opening
// the detail drawer, untouched by this layer).
const _PVD={};
let _pvAnchor=null,_pvMode=null;
function pvScope(name){const arr=_PVD[name]=[];
  return h=>{arr.push(h);return name+':'+(arr.length-1)}}
function pvHtml(id){const s=String(id||''),i=s.lastIndexOf(':');
  const a=_PVD[s.slice(0,i)];return a?a[+s.slice(i+1)]:null}
const pvT=s=>`<div class="pv-t">${s}</div>`;
const pvRow=(k,v,color)=>`<div class="pv-row"><span class="pv-k">${
  color?`<span class="pv-dot" style="background:${color}"></span>`:''}${k}</span><span class="pv-v">${v==null?'':v}</span></div>`;
const pvLine=s=>`<div class="pv-line">${s}</div>`;
function pvEl(){
  let el=document.getElementById('pvCard');
  if(!el){el=document.createElement('div');el.id='pvCard';el.className='pv hidden';
    document.body.appendChild(el);}
  return el;
}
function pvHide(){
  const el=document.getElementById('pvCard');
  if(el)el.classList.add('hidden');
  _pvAnchor=null;_pvMode=null;
}
function pvShow(anchor,mode){
  const html=pvHtml(anchor.getAttribute('data-pv'));
  if(!html){pvHide();return}
  const el=pvEl();
  el.innerHTML=html;
  el.classList.remove('hidden');
  el.style.left='0px';el.style.top='0px';    // measure at natural size first
  const r=anchor.getBoundingClientRect();
  const vw=window.innerWidth,vh=window.innerHeight;
  const pw=el.offsetWidth,ph=el.offsetHeight;
  const x=Math.max(8,Math.min(vw-pw-8,r.left+r.width/2-pw/2));
  let y=r.bottom+8;                          // below the anchor…
  if(y+ph>vh-8)y=r.top-ph-8;                 // …flipped above when cramped
  if(y<8)y=8;                                // both cramped: clamp on screen
  el.style.left=x+'px';el.style.top=y+'px';
  _pvAnchor=anchor;_pvMode=mode;
}
// tap: CAPTURE phase, so an anchor nested inside a clickable row (a 本周
// mini-row, formerly-navigating month cell) shows its info instead of
// letting the row navigate. A tap that became a scroll never produces a
// click at all, so page scrolling stays untouched.
document.addEventListener('click',e=>{
  const a=e.target&&e.target.closest?e.target.closest('[data-pv]'):null;
  if(!a||a.hasAttribute('data-pvh'))return;
  e.preventDefault();e.stopPropagation();
  if(_pvAnchor===a){pvHide();return}         // second tap closes
  pvShow(a,'tap');
},true);
// hover: mouse only — a touch tap must never double-fire through here
document.addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;
  const a=e.target&&e.target.closest?e.target.closest('[data-pv]'):null;
  if(a){if(_pvAnchor!==a)pvShow(a,'hover');return}
  if(_pvMode==='hover'&&!(e.target&&e.target.closest&&e.target.closest('#pvCard')))
    pvHide();
});
// outside tap / any scroll closes a pinned card
document.addEventListener('pointerdown',e=>{
  if(!_pvAnchor)return;
  const t=e.target;
  if(t&&t.closest&&(t.closest('#pvCard')||t.closest('[data-pv]')===_pvAnchor))return;
  pvHide();
});
window.addEventListener('scroll',e=>{
  if(_pvAnchor&&!(e.target&&e.target.id==='pvCard'))pvHide();
},true);

// Deployed-BUILD probe: fetch this very page with a cache-buster and read
// its BUILD constant. Runs only on an explicit ↻ tap, never on a timer.
// (The regex cannot false-match its own source below: after BUILD=' the
// next char there is a paren, which [0-9a-z-] rejects.)
let _newBuild=null;
async function checkNewBuild(){
  try{
    const r=await fetch(location.pathname+'?bc='+Date.now(),{cache:'no-store'});
    if(!r.ok)return null;
    const m=(await r.text()).match(/const BUILD='([0-9a-z-]+)';/);
    return (m&&m[1]!==BUILD)?m[1]:null;
  }catch(_){return null}
}
// ↻ tap: no page reload — re-pull everything and re-render in place, so
// scroll and state survive. Taps while a refresh is in flight are IGNORED
// (not queued). Once a newer BUILD has been spotted the button gets the
// .upd dot and its next tap becomes a full reload on the new ?v=.
let _refreshing=false;
async function doRefresh(){
  if(_refreshing)return;
  const b=document.getElementById('refreshBtn');
  if(_newBuild){location.href=location.pathname+'?v='+encodeURIComponent(_newBuild);return}
  _refreshing=true;if(b)b.classList.add('spin');
  try{
    const [ok,nb]=await Promise.all([refreshAll(),checkNewBuild()]);
    if(nb){_newBuild=nb;if(b)b.classList.add('upd');toast(t('msg.newVer'),'ok');}
    else toast(t(ok?'msg.refreshed':'msg.refreshFail'),ok?'ok':'err');
  }catch(e){console.warn('doRefresh',e);toast(t('msg.refreshFail'),'err')}
  finally{_refreshing=false;if(b)b.classList.remove('spin')}
}

      // activity raster v2: minute-resolution, h23-safe, per-minute density
      // as tick height (user: v1 too coarse, ticks uniform and blobbed)
      const fmtHM=new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',

      const byDay={};
      BK.evid.filter(r=>r.source==='her_msgs').forEach(r=>{
        const d=new Date(r.at_start);
        const day=etD(r.at_start);

        const total=mins.reduce((s,m)=>s+byDay[day][m],0);
        // clusters over raw minute list (gap<=20, >=3 msgs)
        let bands='',run=[mins[0]],runN=byDay[day][mins[0]]||0;
        const flushRun=()=>{if(runN>=3){
          const x1=run[0],x2=run[run.length-1];
          bands+=`<rect x="${x1}" y="3" width="${Math.max(10,x2-x1)}" height="${H-6}" rx="5" fill="var(--accent-fill)" opacity="0.18"/>`;}
          run=[];runN=0;};
        for(let i=1;i<mins.length;i++){
          if(mins[i]-mins[i-1]<=20){run.push(mins[i]);runN+=byDay[day][mins[i]];}
          else{flushRun();run=[mins[i]];runN=byDay[day][mins[i]];}
        }
        flushRun();
        const ticks=mins.map(m=>{
          const n=byDay[day][m];
          const h=n>=3?22:n===2?15:9;       // density → height
          const y=(H-h)/2;
          return `<line x1="${m}" y1="${y.toFixed(1)}" x2="${m}" y2="${(y+h).toFixed(1)}"
            stroke="var(--accent-fill)" stroke-width="3.5" stroke-linecap="round"/>`;
        }).join('');
        const grid=[360,720,1080].map(x=>`<line x1="${x}" y1="4" x2="${x}" y2="${H-4}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>`).join('')
          +`<line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="var(--line)" stroke-width="0.6"/>`;
        return `<div class="bk-raster-row"><span class="bk-raster-d">${esc(day.slice(5))}</span>
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="bk-raster-svg">${grid}${bands}${ticks}</svg>
          <span class="bk-raster-n">${total}条</span></div>`;
      }).join('');
      // hour×day heatmap (macro layer) above the minute raster (micro layer)
      const hourByDay={},hourAll=Array(24).fill(0);
      Object.entries(byDay).forEach(([day,m])=>{
        const hb=hourByDay[day]=Array(24).fill(0);
        Object.entries(m).forEach(([min,n])=>{hb[Math.floor(min/60)]+=n;hourAll[Math.floor(min/60)]+=n});
      });
      const hmMax=Math.max(1,...Object.values(hourByDay).flat());
      const allMax=Math.max(1,...hourAll);
      const hmHead=`<div class="bk-hm-row"><span class="bk-raster-d"></span>
        <div class="bk-hm-cells">`+Array.from({length:24},(_,h)=>
          `<span class="bk-hm-hl">${h%6===0?h:''}</span>`).join('')+`</div><span class="bk-raster-n"></span></div>`;
      const hmAll=`<div class="bk-hm-row"><span class="bk-raster-d">合计</span>
        <div class="bk-hm-cells">`+hourAll.map(n=>
          `<span class="bk-hm-c" style="background:var(--accent-fill);opacity:${n?(0.12+n/allMax*0.85).toFixed(2):0.04}" title="${n}条"></span>`).join('')+`</div><span class="bk-raster-n"></span></div>`;
      const hmRows=days.map(day=>
        `<div class="bk-hm-row"><span class="bk-raster-d">${esc(day.slice(5))}</span>
         <div class="bk-hm-cells">`+hourByDay[day].map(n=>
           `<span class="bk-hm-c" style="background:var(--accent-fill);opacity:${n?(0.12+n/hmMax*0.85).toFixed(2):0.04}" title="${n}条"></span>`).join('')+
         `</div><span class="bk-raster-n">${hourByDay[day].reduce((a,b)=>a+b,0)}条</span></div>`).join('');
      host.innerHTML=`<div class="card"><div class="sc-title">集群证据 · 活跃热力图(近十天)</div>
        <div class="sc-line faint">行=日期, 列=小时, 颜色越深该小时消息越多; 顶行为全期合计画像</div>
        ${hmHead}${hmAll}<div style="height:6px"></div>${hmRows}</div>
        <div class="card"><div class="sc-title">分钟级栅格</div>
        <div class="sc-line faint">一分钟一格; 刻度越高该分钟消息越密; 半透明带为连续工作簇</div>
        ${scale}${rows||`<div class="sc-empty">${esc(t('sc.nodata'))}</div>`}</div>`;
    }
  }catch(e){host.innerHTML=`<div class="sc-empty">${esc(t('msg.cloudErr'))}</div>`;console.warn('bk',e)}
}
// profile text → readable HTML: 【..】 headers, · bullets, [date] stamps.
// Content untouched — this is formatting only (user's request).
function bkProfHtml(c){
  const lines=String(c||'').split('\n');
  let out='',ul=[];
  const flush=()=>{if(ul.length){out+='<ul class="bkp-ul">'+ul.join('')+'</ul>';ul=[]}};
  lines.forEach(raw=>{
    const ln=raw.trim();
    if(!ln){flush();return}
    if(/^【[^】]+】/.test(ln)){flush();
      const m=ln.match(/^(【[^】]+】)(.*)$/);
      out+=`<div class="bkp-h">${esc(m[1])}</div>`;
      if(m[2].trim())out+=`<p class="bkp-p">${esc(m[2].trim())}</p>`;
      return}
    if(/^[·•]/.test(ln)){ul.push(`<li>${esc(ln.replace(/^[·•]\s*/,''))}</li>`);return}
    if(/^\[20\d\d-/.test(ln)){flush();out+=`<div class="bkp-date">${esc(ln)}</div>`;return}
    flush();out+=`<p class="bkp-p">${esc(ln)}</p>`;
  });
  flush();
  return out;
}
// tiny day-bucketed sparkline: dates[] over the last n days → 100x22 svg
function bkSpark(dates,n){
  const today=new Date();
  const buckets=Array(n).fill(0);
  dates.forEach(ds=>{
    const d=new Date(ds+'T12:00:00');
    const diff=Math.round((today-d)/86400000);
    if(diff>=0&&diff<n)buckets[n-1-diff]++;
  });
  const mx=Math.max(1,...buckets);
  const pts=buckets.map((v,i)=>`${(i/(n-1)*96+2).toFixed(1)},${(20-v/mx*16).toFixed(1)}`).join(' ');
  const zero=dates.length===0;
  return `<svg class="bk-spark" viewBox="0 0 100 22" width="100" height="22">
    <polyline points="${pts}" fill="none" stroke="${zero?'var(--line)':'var(--accent-ink)'}" stroke-width="1.5"/>
  </svg>`;
}

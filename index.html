// Meetings are not to-dos: they happen whether or not she acts, and she
// cannot move them alone. They get their own list here, by day, so the
// to-do list below stays "things I must do".
// Standing fixtures she does not want on the two-week rail: the daily lab
// meeting, and the departmental seminar (it only counts when an email
// actually announces that week's talk — her 2026-08-15 ruling).
const DAILY_STANDING=/BDAL|Lab Meeting|组会|Zoom会议|Seminar|研讨会/i;
// A three-week calendar, Monday-first, starting from the Monday of the week
// she is in. Meetings, deadlines and milestones all land in the day box; the
// meeting is the loud one (accent bar + bold clock) because it is the only
// kind she cannot reschedule by herself. Classes collapse to a count.
function renderMeetings(){
  const box=document.getElementById('mtBox');
  if(!box)return;
  const today=vTodayISO();
  const t0=new Date(today+'T12:00');
  const back=(t0.getDay()+6)%7;               // Monday = 0
  const first=new Date(t0); first.setDate(first.getDate()-back);
  const days=[];
  for(let i=0;i<21;i++){
    const d=new Date(first); d.setDate(d.getDate()+i); days.push(lDate(d));
  }
  const lo=days[0], hi=days[20];
  const byDay={};
  DB.forEach(r=>{
    const d=r.date_start;
    if(!d||d<lo||d>hi)return;
    if(r.source!=='gcal'&&r.category!=='meeting')return;
    // days already past show the calendar, not her own logged blocks: an
    // 开会 she recorded at 13:06 is history, not something to look ahead at
    if(d<today&&r.source!=='gcal'&&r.source!=='mail')return;
    if(DAILY_STANDING.test(evName(r)||''))return;
    (byDay[d]=byDay[d]||[]).push(r);
  });
  // deadlines share the box with meetings — she asked for both in one grid
  const ddlDay={};
  (typeof ddlList==='function'?ddlList():[]).forEach(r=>{
    const d=(remDue(r)||'').slice(0,10);
    if(d<lo||d>hi)return;
    const dup=(byDay[d]||[]).some(m=>evName(m)===remTitle(r));
    if(!dup)(ddlDay[d]=ddlDay[d]||[]).push(remTitle(r));
  });
  const H=['一','二','三','四','五','六','日'];
  const parts=d=>{
    const list=(byDay[d]||[]).sort((a,b)=>
      (a.start_time||'').localeCompare(b.start_time||''));
    return {marks:list.filter(r=>!r.start_time),
            cls:list.filter(r=>r.start_time&&r.category==='study'),
            mts:list.filter(r=>r.start_time&&r.category!=='study'),
            ddl:ddlDay[d]||[]};
  };
  const body=(p,full)=>
     p.mts.map(r=>`<div class="mc-mt"><b>${esc((r.start_time||'').slice(0,5))}</b>${esc(evName(r))}</div>`).join('')
    +p.ddl.map(x=>`<div class="mc-ddl">${LANG==='en'?'DDL':'截止'} ${esc(x)}</div>`).join('')
    +p.marks.map(r=>`<div class="mc-mark">◆ ${esc(evName(r))}</div>`).join('')
    +(p.cls.length?`<div class="mc-cls">${LANG==='en'?'Class':'课'} ×${p.cls.length}</div>`:'');
  const cell=d=>{
    const p=parts(d), dt=new Date(d+'T12:00'), wd=dt.getDay();
    const n=p.mts.length+p.marks.length+p.cls.length, nd=p.ddl.length;
    // filled = meeting, hollow = milestone/class, amber = deadline; four
    // identical dots told her nothing about what kind of day it is
    const dots=(n+nd)?`<div class="mc-dots">`
      +Array.from({length:Math.min(p.mts.length,3)},()=>'<i></i>').join('')
      +Array.from({length:Math.min(nd,2)},()=>'<i class="d"></i>').join('')
      +Array.from({length:Math.min(p.marks.length+(p.cls.length?1:0),2)},()=>'<i class="m"></i>').join('')
      +`</div>`:'';
    const num=dt.getDate()+(dt.getDate()===1?`<i>${dt.getMonth()+1}月</i>`:'');
    return `<div class="mcal-d${d===today?' today':''}${d<today?' past':''}`
      +`${(wd===0||wd===6)?' wend':''}">`
      +`<span class="mc-num">${num}</span>${body(p)}${dots}</div>`;
  };
  const list=days.filter(d=>{
    const p=parts(d); return p.mts.length+p.marks.length+p.cls.length+p.ddl.length;
  }).map(d=>{
    const dt=new Date(d+'T12:00');
    return `<div class="mcl-day${d<today?' past':''}"><div class="mcl-dt">${md(d)}<br>周${H[(dt.getDay()+6)%7]}</div>`
      +`<div class="mcl-body">${body(parts(d))}</div></div>`;
  }).join('');
  box.innerHTML=`<div class="mcal">`
    +H.map(h=>`<div class="mcal-h">${h}</div>`).join('')
    +days.map(cell).join('')+`</div>`
    +`<div class="mcal-list">${list||''}</div>`;
}
function renderTodos(){
  renderMeetings();
  // 未完成: overdue first (most overdue on top via due_date ascending),
  // then upcoming by due_date, undated last (newest first)
  const open=TODOS.filter(x=>!x.done).sort((a,b)=>{
    if(!!a.due_date!==!!b.due_date)return a.due_date?-1:1;
    if(a.due_date&&b.due_date&&a.due_date!==b.due_date)
      return a.due_date<b.due_date?-1:1;
    return (b.created_at||'').localeCompare(a.created_at||'');
  });
  document.getElementById('todoOpenBox').innerHTML=
    open.length?open.map(todoRowHtml).join('')
    :`<div class="rev-empty">${esc(t('todo.empty'))}</div>`;
  // 已完成: last 14 days, collapsed by default (details element)
  const since=isoDaysBack(14)[0];
  const done=TODOS.filter(x=>x.done&&((x.done_at||x.created_at||'').slice(0,10)>=since))
    .sort((a,b)=>(b.done_at||'').localeCompare(a.done_at||''));
  document.getElementById('todoDoneBox').innerHTML=
    done.length?done.map(todoRowHtml).join('')
    :`<div class="rev-empty">${esc(t('nodata'))}</div>`;
  // DDLs used to exist only on 统计 — visible but not actionable. Same
  // list, here, with one tap to turn one into a todo she owns.
  const today=vTodayISO();
  const have=new Set(TODOS.map(x=>(x.title||'').trim()));
  const ddl=ddlList();
  const box=document.getElementById('todoDdlBox');
  if(box)box.innerHTML=ddl.length?ddl.map(r=>{
    const due=remDue(r), n=dayDiff(due,today), title=remTitle(r);
    const when=n<0?esc(t('sc.past'))
      :esc(n===0?t('todo.dueToday'):t('sc.daysLeft',{n}));
    const act=have.has(title.trim())?''
      :`<button class="ddl-add" onclick="ddlToTodo(${JSON.stringify(title)
          .replace(/"/g,'&quot;')},'${due}')">${esc(t('ddl.toTodo'))}</button>`;
    return `<div class="todo-row"><span class="td-title">${esc(title)}</span>
      <span class="td-due">${esc(md(due))} · ${when}</span>${act}</div>`;
  }).join(''):`<div class="rev-empty">${esc(t('sc.noDdl'))}</div>`;
  updateTodoBadge();
}
async function ddlToTodo(title,due){
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  try{
    const {error}=await sb.from('todos').insert({title,due_date:due||null,source:'ddl'});
    if(error)throw error;
    toast(t('msg.saved'),'ok');
    await pullTodos();renderTodos();
  }catch(e){console.warn('ddlToTodo',e);toast(t('msg.cloudErr'),'err')}
}
async function addTodo(){
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  const el=document.getElementById('todo-title');
  const title=el.value.trim();
  if(!title){toast(t('msg.needName'),'err');return}
  const due=document.getElementById('todo-due').value||null;
  try{
    const {error}=await sb.from('todos').insert({title,due_date:due,source:'manual'});
    if(error)throw error;
    el.value='';document.getElementById('todo-due').value='';
    toast(t('msg.saved'),'ok');
    await pullTodos();renderTodos();
  }catch(e){console.warn('addTodo',e);toast(t('msg.cloudErr'),'err')}
}
async function toggleTodo(id,checked){
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  const patch={done:checked,done_at:checked?new Date().toISOString():null};
  const {error}=await sb.from('todos').update(patch).eq('id',id);
  if(error){console.warn('toggleTodo',error);toast(t('msg.cloudErr'),'err');return}
  await pullTodos();
  if(_tab==='todo')renderTodos();
}

// ---- tabs -------------------------------------------------------------
let _tab='today';
// ---- 决策 session -----------------------------------------------------
// 正文全部存在 Supabase 的 decisions 表(RLS owner=auth.uid()),
// 本文件不含任何内容 —— 这个仓库是公开的。
let decLoaded=false, DEC=[];
const DEC_KINDS=[['frame','框架'],['var','关键变量'],['option','选项'],['event','信息流']];
async function pullDec(){
  const {data,error}=await sb.from('decisions').select('*')
    .order('on_date',{ascending:false}).order('created_at',{ascending:false});
  if(error){console.warn('dec',error);return;}
  DEC=data||[];decLoaded=true;
  const tp=DEC.length&&DEC[0].topic;
  if(tp){const el=document.querySelector('#tab-dec .chart-title');if(el)el.textContent=tp;}
  renderDec();
}
function decDir(d){
  if(d==='+')return '<span style="color:#2e9e5b;font-weight:600">利好</span>';
  if(d==='-')return '<span style="color:#c0392b;font-weight:600">利空</span>';
  return '<span style="opacity:.55">中性</span>';
}
function renderDec(){
  const box=document.getElementById('decBox');if(!box)return;
  if(!DEC.length){
    box.innerHTML='<div class="card" style="opacity:.6">'+(decLoaded?'暂无内容':'载入中…')+'</div>';return;}
  let h='';
  for(const kk of DEC_KINDS){
    const rows=DEC.filter(r=>r.kind===kk[0]);
    if(!rows.length)continue;
    h+='<div class="chart-title" style="margin:14px 0 6px">'+kk[1]+'</div>';
    for(const r of rows){
      h+='<div class="card" style="margin-bottom:10px">'
        +'<div class="row" style="gap:8px;align-items:baseline;flex-wrap:wrap">'
        +'<b>'+esc(r.title)+'</b>'
        +(r.affects?'<span style="font-size:12px;opacity:.6">'+esc(r.affects)+'</span>':'')
        +(r.direction?' · '+decDir(r.direction):'')
        +'<span style="margin-left:auto;font-size:12px;opacity:.5">'+esc(r.on_date||'')+'</span>'
        +'</div>'
        +'<div style="white-space:pre-wrap;margin-top:6px;line-height:1.6">'+esc(r.body)+'</div>'
        +(r.source_url?'<div style="margin-top:6px"><a href="'+esc(r.source_url)
          +'" target="_blank" rel="noopener" style="font-size:12px">来源</a></div>':'')
        +'</div>';
    }
  }
  box.innerHTML=h;
}
function switchTab(tp){
  _tab=tp;
  document.querySelectorAll('.tab').forEach(b=>{
    const on=b.dataset.tab===tp;
    b.classList.toggle('active',on);
    // item 8: on phones the strip scrolls, so bring the active tab into
    // view — otherwise several tabs show no active indicator at all
    if(on&&b.scrollIntoView)try{b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}catch(_){}
  });
  ['today','week','month','stat','todo','spend','sleep','diet','sport','add','review','ach','dec'].forEach(s=>
    document.getElementById('tab-'+s).classList.toggle('hidden',s!==tp));
  renderActive();
}
function toggleInsight(){
  const el=document.getElementById('insightText');
  const btn=document.getElementById('insMore');
  const on=el.classList.toggle('clamp');
  btn.textContent=t(on?'more':'less');
}
function renderActive(){
  pvHide();          // anchors are about to be rebuilt
  tlSyncMetrics();
  if(SI_TABS[_tab]){safeRender([()=>renderSecInsight(_tab)]);
    if(!secInsLoaded)pullSecInsights();}
  if(_tab==='today')renderToday();
  else if(_tab==='week')renderWeek();
  else if(_tab==='month')renderMonth();
  else if(_tab==='stat')renderStat();
  else if(_tab==='review'){renderReview();if(!siteUpdLoaded)pullSiteUpdates();}
  else if(_tab==='sleep'){renderSleepTab();if(!healthLoaded)pullHealth();
    if(!weeklyLoaded)pullWeekly();if(!habitsLoaded)pullHabits();}
  else if(_tab==='diet'){renderDietTab();if(!healthLoaded)pullHealth();
    if(!weeklyLoaded)pullWeekly();if(!habitsLoaded)pullHabits();}
  else if(_tab==='sport'){renderSportTab();if(!healthLoaded)pullHealth();
    if(!weeklyLoaded)pullWeekly();if(!habitsLoaded)pullHabits();}
  else if(_tab==='todo'){renderTodos();renderMemos();renderRecipes();
    if(!todoLoaded)pullTodos();if(!memoLoaded)pullMemos();}
  else if(_tab==='spend'){renderSpend();if(!spendLoaded)pullSpend();}
  else if(_tab==='ach'){renderAch();
    if(!achLoaded)pullAch();if(!actionsLoaded)pullActions();}
  else if(_tab==='dec'){renderDec();if(!decLoaded)pullDec();}
  fitStatGrids();
  updateReviewBadge();
  updateTodoBadge();
}

// ---- startup ----------------------------------------------------------
(function init(){
  // default add-form date = the VISUAL today (03:00 pivot): an entry typed
  // at 00:53 belongs to the day 今天/审查 are already showing, not to the
  // calendar date the clock just rolled over to
  document.getElementById('f-date').value=vTodayISO();
  document.getElementById('review-date').value=vTodayISO();
  document.getElementById('buildStamp').textContent='build '+BUILD;
  document.getElementById('buildStampFoot').textContent='build '+BUILD;
  // re-render on rotation / width change so density switches cleanly
  let _rzT;
  window.addEventListener('resize',()=>{clearTimeout(_rzT);
    _rzT=setTimeout(()=>{tlSyncMetrics();renderActive();},180);});
  applyTheme();
  setInterval(applyTheme,5*60000);   // auto day/night re-check
  applyLang();
  switchTab('today');
  initCloud();refreshAuthGate();
})();
</script>

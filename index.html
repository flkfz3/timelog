async function toggleAction(id){
  if(!cloud||!authed)return;
  const row=ACTIONS.find(r=>String(r.id)===String(id));if(!row)return;
  const was={done:row.done,done_at:row.done_at};
  row.done=!row.done;
  row.done_at=row.done?new Date().toISOString():null;
  renderActions();                       // optimistic — cloud confirms after
  if(row.done)celebrate(document.querySelector(
    '.ia-row[data-aid="'+id+'"] .ia-chk'));
  const {error}=await sb.from('insight_actions')
    .update({done:row.done,done_at:row.done_at}).eq('id',id);
  if(error){row.done=was.done;row.done_at=was.done_at;renderActions();
    console.warn('toggleAction',error);toast(t('msg.cloudErr'),'err');}
}
// ✕ = "这条不适用于我". The row disappears, and the dismissal is stored so
// the nightly butler stops suggesting that theme (her explicit contract).
async function dismissAction(id){
  if(!cloud||!authed)return;
  const row=ACTIONS.find(r=>String(r.id)===String(id));if(!row)return;
  row.dismissed=true;
  renderActions();
  const {error}=await sb.from('insight_actions')
    .update({dismissed:true}).eq('id',id);
  if(error){row.dismissed=false;renderActions();
    console.warn('dismissAction',error);toast(t('msg.cloudErr'),'err');}
}
// WeChat-falling-stars-flavoured burst: ~16 particles pop from the checked
// box, fall with a sway, fade within ~1.2s. Text glyphs + coloured dots
// only, fixed-position so it rides over the hero without reflow.
function celebrate(el){
  if(!el)return;
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const host=document.createElement('div');host.className='cf-burst';
  const cols=['#FFD166','#FF9F8E','#8ECDF4','#ffffff'];
  for(let i=0;i<16;i++){
    const p=document.createElement('span');p.className='cf-p';
    const s=document.createElement('span');
    const star=i%3===0;
    s.className='cf-s'+(star?'':' cf-dot');
    if(star)s.textContent='★';
    p.style.cssText=`left:${cx}px;top:${cy}px;`
      +`--dx:${((Math.random()*2-1)*70).toFixed(0)}px;`
      +`--fy:${(60+Math.random()*90).toFixed(0)}px;`
      +`--dur:${(.9+Math.random()*.45).toFixed(2)}s;`
      +`animation-delay:${(Math.random()*.12).toFixed(2)}s`;
    s.style.cssText=`--c:${star?'#FFD166':cols[i%cols.length]};`
      +`--sz:${(9+Math.random()*6).toFixed(0)}px;`
      +`--sway:${(.35+Math.random()*.3).toFixed(2)}s`;
    p.appendChild(s);host.appendChild(p);
  }
  document.body.appendChild(host);
  setTimeout(()=>host.remove(),1600);
}

async function postComment(d,boxKey){
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  const el=document.getElementById('cmt-in-'+boxKey);if(!el)return;
  const text=el.value.trim();if(!text)return;

// ---- event time model -------------------------------------------------
// Prefer precise start_at/end_at (timestamptz). Fall back to legacy
// date_start + start_time/end_time for rows that predate the timelog columns.
// Returns {iso, sm, em} where iso is the local day, sm/em are minutes from
// local midnight (em may exceed 1440 for cross-midnight events), or null.
function evTime(r){
  // Wall-clock strings are AUTHORITATIVE: date_start/start_time/end_time
  // hold the ET wall time the user typed or synced, and they never pass
  // through the browser's timezone. Deriving display times from
  // start_at via new Date().getHours() shifts everything by the browser
  // offset on a non-ET machine (+8h on a Chinese-locale laptop showed
  // 11:00 as 23:00). start_at is only the fallback for rows that predate
  // the legacy columns.
  // (when an end exists only as end_at, the legacy pair is incomplete —
  // fall through to the start_at path rather than fabricate a +60 end)
  if(r.date_start&&r.start_time&&(r.end_time||!r.end_at)){
    const lt=legacyTime(r);
    if(lt)return lt;
  }
  if(r.start_at){
    const s=new Date(r.start_at);
    if(isNaN(s))return legacyTime(r);
    const iso=lDate(s);
    const sm=s.getHours()*60+s.getMinutes();
    let em=null;
    if(r.end_at){
      const e=new Date(r.end_at);
      if(!isNaN(e)){
        const dayDiff=Math.round((new Date(lDate(e)+'T00:00:00')-new Date(iso+'T00:00:00'))/86400000);
        em=dayDiff*1440 + e.getHours()*60 + e.getMinutes();
        if(em<=sm)em=sm+60;
      }
    }
    if(em==null)em=sm+60;
    return {iso,sm,em};
  }
  return legacyTime(r);
}
function legacyTime(r){
  const iso=(r.date_start||'').slice(0,10);
  if(!iso)return null;
  if(!r.start_time)return {iso,sm:null,em:null};   // all-day
  const sm=_hm2min(r.start_time);
  let em=r.end_time?_hm2min(r.end_time):sm+60;

function evHoursOnDay(r,iso){
  const tm=evTime(r);if(!tm||tm.sm==null||tm.iso!==iso)return 0;
  const dur=Math.min(tm.em,1440)-tm.sm;     // clip cross-midnight tail
  return dur>0?dur/60:0;

  // touch: a range-drag needs the same long-press arm, and a scroll that
  // starts on empty timeline must not end up opening the Add form
  _tlDrag={op:'create',body,iso:col.dataset.iso,rect,
    touch:tlIsTouch(e),armTimer:null,armed:!tlIsTouch(e),scrolled:false,
    startY:e.clientY,anchor:e.clientY-rect.top,curY:e.clientY,
    ghost:null,moved:false,pointerId:e.pointerId};
  if(_tlDrag.touch){
    const d=_tlDrag;
    d.armTimer=setTimeout(()=>{
      if(_tlDrag!==d||d.scrolled)return;
      d.armed=true;_tlArmed=true;
      try{navigator.vibrate&&navigator.vibrate(15);}catch(_){}
      // same "gesture registered" cue as blocks: a lit ghost of the slot
      // she is about to create, drawn BEFORE the form appears
      if(!d.ghost){
        d.ghost=document.createElement('div');
        d.ghost.className='tl-ghost armed';
        d.body.appendChild(d.ghost);
      }
      d.ghost.style.top=d.anchor+'px';
      d.ghost.style.height=(TL_HPX)+'px';        // 60-min default slot
    },TL_LONGPRESS_MS);
  }
  try{body.setPointerCapture(e.pointerId);}catch(_){}
  body.addEventListener('pointermove', tlCreateMove);
  body.addEventListener('pointerup', tlCreateEnd);
  body.addEventListener('pointercancel', tlCreateEnd);
}
function tlCreateMove(e){
  const d=_tlDrag;if(!d||d.op!=='create')return;
  if(d.touch&&!d.armed){
    if(Math.abs(e.clientY-d.startY)>TL_PRESS_SLOP){
      d.scrolled=true;clearTimeout(d.armTimer);   // page is scrolling
    }
    return;
  }
  if(!d.moved&&Math.abs(e.clientY-d.startY)>4){
    d.moved=true;
    if(!d.ghost){                       // may already exist as the arm cue
      d.ghost=document.createElement('div');
      d.ghost.className='tl-ghost';
      d.body.appendChild(d.ghost);
    }
  }
  if(!d.moved)return;
  d.curY=e.clientY;
  const y=e.clientY-d.rect.top;
  const y1=Math.max(0,Math.min(d.anchor,y)), y2=Math.min(TL_BODY_PX,Math.max(d.anchor,y));
  d.ghost.style.top=y1+'px';
  d.ghost.style.height=Math.max(4,y2-y1)+'px';
}
function tlCreateEnd(e){
  const d=_tlDrag;_tlDrag=null;if(!d||d.op!=='create')return;
  clearTimeout(d.armTimer);tlDisarm();
  try{d.body.releasePointerCapture(d.pointerId);}catch(_){}
  d.body.removeEventListener('pointermove', tlCreateMove);
  d.body.removeEventListener('pointerup', tlCreateEnd);
  d.body.removeEventListener('pointercancel', tlCreateEnd);
  if(d.ghost)d.ghost.remove();
  if(d.scrolled)return;          // that gesture was a page scroll
  // On touch, empty timeline is primarily a SCROLL surface: creating an
  // event is a deliberate act, so a quick tap does nothing at all —
  // only the 400ms arm opens the form. Mouse/pen keeps click-to-add.
  if(d.touch&&!d.armed)return;
  const clampOff=m=>Math.max(0,Math.min(1440,m));
  if(!d.moved){
    // plain click: 30-min snap, 60-min slot (kaileme's tlSlotClick)
    const y=Math.max(0,e.clientY-d.rect.top);
    const off=clampOff(TL_CLIP_FROM+Math.round(y/TL_HPX*60/30)*30);
    openAddPrefill(d.iso,off,off+60);
    return;
  }
  // drag range: 15-min snap, min 15 min
  const mA=TL_CLIP_FROM+d.anchor/TL_HPX*60, mB=TL_CLIP_FROM+(d.curY-d.rect.top)/TL_HPX*60;
  let s=clampOff(Math.round(Math.min(mA,mB)/15)*15);
  let en=clampOff(Math.round(Math.max(mA,mB)/15)*15);
  if(en-s<15)en=s+15;
  openAddPrefill(d.iso,s,en);
}
function openAddPrefill(iso,offS,offE){

}
// --- drag a block to move (whole event, even when clipped) -------------
function tlDragStart(e){
  if(e.button!==undefined&&e.button!==0)return;
  tlPressGate(e,e.currentTarget,tlDragBegin);
}
function tlDragBegin(e,el){
  const r=DB.find(x=>x.id===el.dataset.rid);
  if(!r)return;
  const tm=evTime(r);
  if(!tm||tm.sm==null)return;
  if(e.preventDefault)e.preventDefault();
  const cols=Array.from(document.querySelectorAll('.tl-cols .tl-col'));
  const colIsos=cols.map(c=>c.dataset.iso||'');
  const colIdx=Math.max(0,colIsos.indexOf(el.dataset.iso));
  const colW=cols.length?cols[0].getBoundingClientRect().width:0;
  _tlDrag={op:'move',el,id:r.id,origIso:el.dataset.iso,
    segOff:+el.dataset.offmin||0,durMin:tm.em-tm.sm,
    colIsos,colIdx,colW,shift:0,
    startX:e.clientX,startY:e.clientY,
    origTop:parseFloat(el.style.top)||0,
    moved:false,pointerId:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.addEventListener('pointermove', tlDragMove);
  el.addEventListener('pointerup', tlDragEnd);
  el.addEventListener('pointercancel', tlDragEnd);
}
function tlDragMove(e){
  const d=_tlDrag;if(!d||d.op!=='move')return;
  const dy=e.clientY-d.startY, dx=e.clientX-d.startX;
  if(!d.moved&&(Math.abs(dy)>4||Math.abs(dx)>4)){
    d.moved=true;d.el.classList.add('dragging');
  }
  if(!d.moved)return;
  d.el.style.top=(d.origTop+dy)+'px';
  if(d.colIsos.length>1&&d.colW>0){
    d.shift=Math.round(dx/d.colW);
    d.el.style.transform=`translateX(${d.shift*d.colW}px)`;
  }
}
function tlDragEnd(e){
  const d=_tlDrag;_tlDrag=null;tlDisarm();if(!d||d.op!=='move')return;
  try{d.el.releasePointerCapture(d.pointerId);}catch(_){}
  d.el.removeEventListener('pointermove', tlDragMove);
  d.el.removeEventListener('pointerup', tlDragEnd);
  d.el.removeEventListener('pointercancel', tlDragEnd);
  if(!d.moved){d.el.classList.remove('dragging');return;}
  d.el._wasDragged=true;
  const ni=Math.max(0,Math.min(d.colIsos.length-1,d.colIdx+d.shift));
  const newIso=d.colIsos[ni]||d.origIso;
  // snap the dragged segment's top within its window, THEN convert to an
  // absolute instant and subtract the segment's offset into the event
  let offMin=TL_CLIP_FROM+Math.round((parseFloat(d.el.style.top)/TL_HPX*60)/15)*15;
  offMin=Math.max(0,Math.min(1440-15,offMin));
  const newStartMs=w0ms(newIso)+offMin*60000-d.segOff*60000;
  applyAbsTimes(d.id,newStartMs,newStartMs+d.durMin*60000,'msg.moved');
}
// --- edge resize: top = true start, bottom = true end ------------------
function tlResizeStart(e){
  if(e.button!==undefined&&e.button!==0)return;
  if(e.stopPropagation)e.stopPropagation();
  tlPressGate(e,e.currentTarget,tlResizeBegin);
}
function tlResizeBegin(e,handle){
  if(e.preventDefault)e.preventDefault();
  const blk=handle.parentElement;
  const r=DB.find(x=>x.id===blk.dataset.rid);
  if(!r)return;

  _tlDrag={op:'resize',edge:handle.classList.contains('top')?'top':'bottom',
    el:blk,handle,id:r.id,segIso:blk.dataset.iso,

    startY:e.clientY,

    origHeight:parseFloat(blk.style.height)||30,
    moved:false,pointerId:e.pointerId};
  try{handle.setPointerCapture(e.pointerId);}catch(_){}
  handle.addEventListener('pointermove', tlResizeMove);
  handle.addEventListener('pointerup', tlResizeEnd);
  handle.addEventListener('pointercancel', tlResizeEnd);
}
function tlResizeMove(e){
  const d=_tlDrag;if(!d||d.op!=='resize')return;
  const dy=e.clientY-d.startY;
  if(!d.moved&&Math.abs(dy)>3){d.moved=true;d.el.classList.add('dragging');}
  if(!d.moved)return;
  if(d.edge==='top'){
    let nt=d.origTop+dy, nh=d.origHeight-dy;
    if(nh<12){nh=12;nt=d.origTop+d.origHeight-12;}
    d.el.style.top=nt+'px';
    d.el.style.height=nh+'px';
  }else{
    d.el.style.height=Math.max(12,d.origHeight+dy)+'px';
  }
}
function tlResizeEnd(e){
  const d=_tlDrag;_tlDrag=null;tlDisarm();if(!d||d.op!=='resize')return;
  try{d.handle.releasePointerCapture(d.pointerId);}catch(_){}
  d.handle.removeEventListener('pointermove', tlResizeMove);
  d.handle.removeEventListener('pointerup', tlResizeEnd);
  d.handle.removeEventListener('pointercancel', tlResizeEnd);
  if(!d.moved){d.el.classList.remove('dragging');return;}
  d.el._wasDragged=true;
  let sMs=d.trueS, eMs=d.trueE;
  if(d.edge==='top'){
    const off=TL_CLIP_FROM+Math.round((parseFloat(d.el.style.top)/TL_HPX*60)/15)*15;
    sMs=w0ms(d.segIso)+off*60000;
    if(sMs>eMs-15*60000)sMs=eMs-15*60000;
  }else{
    const bot=parseFloat(d.el.style.top)+parseFloat(d.el.style.height);
    const off=TL_CLIP_FROM+Math.round((bot/TL_HPX*60)/15)*15;
    eMs=w0ms(d.segIso)+off*60000;
    if(eMs<sMs+15*60000)eMs=sMs+15*60000;
  }
  applyAbsTimes(d.id,sMs,eMs,'msg.resized');
}

// Phone clip window: [first record −1h, last +1h], snapped to the hour.
// Desktop always renders the full 24h grid exactly as before.
function dayClipFor(iso){
  if(!isPhone()||_dayFull)return null;
  let lo=null,hi=null;
  DB.forEach(r=>{
    evSegments(r).forEach(sg=>{
      if(sg.iso!==iso)return;
      lo=lo==null?sg.ws:Math.min(lo,sg.ws);
      hi=hi==null?sg.we:Math.max(hi,sg.we);
    });
  });
  if(lo==null)return null;
  const from=Math.max(0,Math.floor((lo-60)/60)*60);
  const to=Math.min(1440,Math.ceil((hi+60)/60)*60);
  if(to-from>=1380)return null;            // basically the whole day anyway
  return {from,min:to-from};
}

function tlAnchorGutter(iso){
  const fmm=m=>{const c=((TL_H0*60+m)%1440+1440)%1440;
    return String(Math.floor(c/60)).padStart(2,'0')+':'+String(c%60).padStart(2,'0')};
  const rows=[];
  ANCHORS.forEach(a=>{
    const d=new Date(a.at);if(isNaN(d))return;
    const aIso=lDate(new Date(d.getTime()-TL_H0*3600000));
    if(aIso!==iso)return;
    const ws=Math.round((d.getTime()-w0ms(iso))/60000);
    const top=(ws-TL_CLIP_FROM)/60*TL_HPX;
    if(top<-2||top>TL_BODY_PX)return;
    rows.push({top,ws,label:String(a.label||'').slice(0,30)});
  });
  // 个护 spans ride the same gutter, drawn as a seated figure + the range
  DB.forEach(r=>{
    if(!IS_TOILET.test(evName(r)))return;

      if(sg.iso!==iso)return;
      const top=(sg.ws-TL_CLIP_FROM)/60*TL_HPX;
      if(top<-2||top>TL_BODY_PX)return;
      // the Thinker already says "toilet" — printing 上厕所 next to it is
      // saying it twice (her 2026-08-16 note). Other 个护 rows still need
      // their name, because the icon does not distinguish 洗澡 from 洗漱.
      rows.push({top,ws:sg.ws,care:true,id:r.id,

  // downward instead of overprinting; the printed time stays the true time
  rows.sort((a,b)=>a.top-b.top);

// Per-day assessment under the week timeline. Coverage = non-parallel
// logged minutes on the visual day (sleep INCLUDED) / 1440; days under
// 50% get a muted placeholder, no analysis. Otherwise: total logged
// hours, top-2 non-sleep categories, sleep duration, and the nightly
// daily_reviews insight when one exists for that date.
function weekAssessRow(iso,dayLbl){
  // the day label is the jump target (plain tap → 今天 tab on that date);
  // the rest of the row keeps its own behaviour (insight more/less toggle)
  const dayCell=`<span class="wk-an-day" onclick="gotoDay('${iso}')">${esc(dayLbl)}<span class="wk-an-go">›</span></span>`;
  if(iso>vTodayISO())   // future day: schedule, nothing to assess
    return `<div class="wk-an-row">${dayCell}
      <div class="wk-an-main"><span class="wk-an-low">—</span></div></div>`;
  const byCat={};let tot=0;
  DB.forEach(r=>{
    if(r.parallel)return;
    evSegments(r).forEach(sg=>{
      if(sg.iso!==iso)return;
      const min=sg.we-sg.ws;
      if(min<=0)return;
      const c=r.category||'other';
      byCat[c]=(byCat[c]||0)+min;

    });

  }else{
    const sep=LANG==='zh'?'、':', ';
    const top2=Object.entries(byCat).filter(([c])=>c!=='sleep')
      .sort((a,b)=>b[1]-a[1]).slice(0,2);
    // day-level allocation against the day total printed right beside it —
    // the same numbers 统计/日 shows for this date
    const TT=catTenths(byCat,tot);
    const parts=[(LANG==='zh'?'共':'')+fmtHours(tot/60)+(LANG==='zh'?'':' logged')];
    const nw=(c)=>`<span class="nw">${esc(catLabel(c))} ${fmtTenths(TT[c])}</span>`;
    if(top2.length)parts.push(top2.map(([c])=>nw(c)).join(sep));
    if(byCat.sleep)parts.push(`<span class="nw">${esc(t('sl.inDay'))} ${fmtTenths(TT.sleep)}</span>`);
    // item 6: this same ~600-char text also fills the hero card, so on
    // phones the row stays one line and the text hides behind a toggle
    const ins=INSIGHTS[iso];
    const insight=ins
      ?(isPhone()
        ?`<button class="ins-more" style="color:var(--accent-ink);opacity:1"
            onclick="var s=this.nextElementSibling;s.classList.toggle('hidden');

            >${esc(t('more'))}</button><div class="wk-an-insight hidden">${proseHtml(ins)}</div>`
        :`<div class="wk-an-insight">${proseHtml(ins)}</div>`)
      :'';
    main=parts.join(' · ')+(ins&&isPhone()?' ':'')+insight;
  }
  return `<div class="wk-an-row">${dayCell}
    <div class="wk-an-main">${main}</div></div>`;
}

// Shared ring renderer (month mini rings + stats ring — one visual
// language). Faint --well full track, colored arcs on top; everything is
// drawn in a 32-unit viewBox and scaled by `size`, so stroke proportions
// stay identical at every size. arcs=[{f0,fl,color,title}] as fractions of
// the circle; the un-arced remainder stays transparent (track only).
function ringSvg(arcs,opts){
  const R=12.5,C=2*Math.PI*R;
  const size=opts.size||32, minLen=opts.minLen!=null?opts.minLen:0.6;
  // track and arcs share a stroke width, else arcs protrude past the ring
  let rings=`<circle r="${R}" cx="16" cy="16" fill="none" stroke-width="5"
    style="stroke:var(--well)"/>`;
  arcs.forEach(a=>{
    const off=a.f0*C;
    const len=Math.max(minLen,a.fl*C);   // keep tiny arcs visible
    // an arc with a popover id drops its native <title> — one tooltip, not two
    rings+=`<circle r="${R}" cx="16" cy="16" fill="none" stroke="${a.color}"
      stroke-width="5" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-off).toFixed(2)}"${a.pv?` data-pv="${a.pv}"`:''}>
      ${a.pv?'':`<title>${a.title||''}</title>`}</circle>`;
  });
  let text='';
  if(opts.label){
    text=`<text x="16" y="16.5" text-anchor="middle" dominant-baseline="central"
      font-size="${opts.labelSize||9}" font-weight="700"
      style="fill:var(--ink)">${esc(opts.label)}</text>`;
  }
  return `<svg class="${opts.cls||''}" viewBox="0 0 32 32" width="${size}" height="${size}">
    <g transform="rotate(-90 16 16)">${rings}</g>${text}</svg>`;
}
// Category-aggregated arcs over a real-time period: one arc per category
// (CATS order, starting at 12 o'clock), length = its share of periodMin;
// the unrecorded remainder stays transparent. Shared by the stats ring and
// the month mini rings — same semantics at both sizes.
// `fmt` lets the caller hand in the SAME allocated hours its legend prints,
// so an arc tooltip can never say 会议 2.6h beside a legend row of 2.5h.
function catArcs(byCatMin,periodMin,fmt){
  const order=CATS.concat(Object.keys(byCatMin).filter(c=>!CATS.includes(c)));
  let acc=0;const arcs=[];
  order.forEach(c=>{
    const v=byCatMin[c];if(!v)return;
    arcs.push({f0:acc/periodMin,fl:v/periodMin,color:catColor(c),
      title:esc(catLabel(c))+' '+(fmt?fmt(c):fmtHours(v/60))});
    acc+=v;
  });
  return arcs;
}
// Month cell ring: per-category totals of that visual day (sleep included,
// parallel excluded); center = non-sleep logged hours.
function monthRing(byCatMin,totalH){
  // item 18: 27 of 31 cells drew an empty ring — only draw one when the
  // day has data; item 3: smaller ring on phones so 7 cells fit 298px
  if(!Object.keys(byCatMin).length)return '';
  // a day whose only record is sleep has 0 non-sleep hours; drawing the
  // ring with an empty centre read as a failed render
  let lbl=totalH>=9.95?String(Math.round(totalH)):String(Math.round(totalH*10)/10);
  return ringSvg(catArcs(byCatMin,1440),
    {size:isPhone()?24:32,cls:'mo-pie',label:lbl,labelSize:isPhone()?11:9});
}

// ---- Stats dashboard --------------------------------------------------
// Card grid; each card answers one question. Rolling window: 周 = last 7
// visual days, 月 = last 30, both ending on the current visual day; deltas
// compare against the previous equal-length block. Sparse data degrades to
// muted 数据不足 — never fake numbers, never judge.
let STAT_RANGE='w', STAT_DAY=null;   // STAT_DAY: visual day shown in 日 mode
function setStatRange(r){STAT_RANGE=r;renderStat();}
function shiftStatDay(n){
  const d=shiftISO(STAT_DAY||vTodayISO(),n);
  STAT_DAY=d>vTodayISO()?vTodayISO():d;   // stats are retrospective only
  renderStat();
}
function shiftISO(iso,d){const x=new Date(iso+'T00:00:00');x.setDate(x.getDate()+d);return lDate(x)}
function lastNDaysEnd(endIso,n){const out=[];for(let i=n-1;i>=0;i--)out.push(shiftISO(endIso,-i));return out}
function vTodayISO(){return lDate(new Date(Date.now()-TL_H0*3600000))}
// one spelling for minutes everywhere: `10m` in the ring, the weekly bars,
// the type list and the daily chart alike
// ONE word per unit, app-wide. `10m` sat beside `目标 150 分钟` and
// `1060 kcal` beside `405 千卡` on the same screen; the display language
// decides the spelling and everything uses these two.
const fmtMin=v=>Math.round(v)+(LANG==='zh'?' 分钟':' min');
const fmtKcal=v=>Math.round(v)+(LANG==='zh'?' 千卡':' kcal');
const fmtClock=m=>{m=((Math.round(m)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);
  const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
// minutes per category / per day over a set of visual days (parallel
// bucketed separately, sleep included)
function aggPeriod(daysArr){
  // retrospective by definition: segments after the current visual day
  // (imported future schedule) never count as spent time
  const vt=vTodayISO();
  const set=new Set(daysArr);
  const byCat={},dayTot={};let tot=0,par=0;
  DB.forEach(r=>{
    const isPar=!!r.parallel;
    evSegments(r).forEach(sg=>{
      if(sg.iso>vt)return;
      if(!set.has(sg.iso))return;
      const min=sg.we-sg.ws;if(min<=0)return;
      if(isPar){par+=min;return;}
      const c=r.category||'other';
      byCat[c]=(byCat[c]||0)+min;
      dayTot[sg.iso]=(dayTot[sg.iso]||0)+min;
      tot+=min;
    });
  });
  // the window this aggregate covers, so a card can name its own range
  const rng=daysArr.length?(daysArr.length===1?md(daysArr[0])
    :mdRange(daysArr[0],daysArr[daysArr.length-1])):'';
  return {byCat,dayTot,tot,par,range:rng};
}
const INVEST=['meeting','work','study'];   // 正业口径(她定): 会+工作+学习
function renderStat(){
  ['d','w','m'].forEach(r=>document.getElementById('rng-'+r)
    .classList.toggle('active',STAT_RANGE===r));

  if(!STAT_DAY)STAT_DAY=vt;
  const day=STAT_RANGE==='d';
  document.getElementById('statDayNav').classList.toggle('hidden',!day);
  if(day)document.getElementById('statDayLbl').textContent=STAT_DAY;
  const n=day?1:(STAT_RANGE==='w'?7:30);
  const endIso=day?STAT_DAY:vt;
  const cur=lastNDaysEnd(endIso,n), prev=lastNDaysEnd(shiftISO(endIso,-n),n);
  const A=aggPeriod(cur), P=aggPeriod(prev);
  document.getElementById('statGrid').innerHTML=[
    cardInvest(A,P),
    cardWhere(A,n),
    cardRhythm(cur),
    cardGrowth(A,vt),
    cardTodos(),
    cardDDL(),
    cardCover(A,P,cur,prev,vt)
    // item 6: the 洞察 card repeated the hero text verbatim — dropped
  ].join('');
  fitStatGrids();   // range buttons re-render the grid without renderActive
}
function scCard(titleKey,body,cls){
  // the body is one element so a stretched card can centre it
  return `<div class="card${cls?' '+cls:''}"><div class="sc-title">${esc(t(titleKey))}</div>
    <div class="sc-body">${body}</div></div>`;
}
const scEmpty=()=>`<div class="sc-empty">${esc(t('sc.nodata'))}</div>`;
// 1. 投入 — invested hours (work+study+growth+meeting) + delta vs previous
// period. Down-delta stays muted: information, not judgment.
function cardInvest(A,P){
  if(!A.tot&&!P.tot)return scCard('sc.invest',scEmpty());
  const sum=o=>INVEST.reduce((s,c)=>s+(o.byCat[c]||0),0);
  const cur=sum(A)/60, prev=sum(P)/60;
  let delta='';
  if(P.tot>0&&Math.abs(cur-prev)>=0.05){
    const up=cur>prev;
    delta=`<span class="sc-delta ${up?'up':'down'}">${up?'↑':'↓'}${fmtHours(Math.abs(cur-prev))}</span>`;
  }
  // headline = the sum of the printed parts, and the parts come from the
  // period-wide allocation the donut legend uses — so 19.1h never sits on
  // top of 9.5+7.1+2.6, and 会议 reads the same in both cards
  const TT=catTenths(A.byCat,A.tot);
  const shown=INVEST.filter(c=>A.byCat[c]);
  const bits=shown.map(c=>
    `<span class="nw">${esc(catLabel(c))} ${fmtTenths(TT[c])}</span>`);
  return scCard('sc.invest',`<span class="sc-big">${fmtTenths(sumTenths(TT,shown))}</span>${delta}
    ${bits.length?`<div class="sc-line">${bits.join(' · ')}</div>`:''}`);
}
// Parts are each rounded on their own, so naive per-part rounding drifts
// from the (separately rounded) total — 5 rows could disagree by up to
// 0.25h, and the card showed 55.5h of rows around a 55.3h centre.
// Largest-remainder allocation: hand out exactly the total's units, so the
// printed parts always add up to the printed total. `units` are the parts
// already expressed in the display unit (tenths of an hour, cents…),
// `target` is the total in that same unit.
function unitAlloc(units,target){
  const out=units.map(x=>Math.floor(x));
  let rest=Math.round(target)-out.reduce((a,b)=>a+b,0);
  const order=units.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;rest>0&&k<order.length;k++,rest--)out[order[k][1]]++;
  return out;
}
// vals are hours; target is the centre value in tenths of an hour.
function tenthsAlloc(vals,target){return unitAlloc(vals.map(v=>v*10),target)}
const fmtTenths=x=>x>0?(x/10).toFixed(1)+'h':'0h';
// ONE allocation per period, keyed by category: every card on the 统计
// screen reads the SAME map, so 会议 cannot print 2.6h in 投入 and 2.5h in
// the 时间去哪了 legend right below it. Order is largest-first (the order
// the donut legend lists them in) so the allocation is deterministic.
function catTenths(byCat,totMin){
  const keys=Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  const got=tenthsAlloc(keys.map(c=>byCat[c]/60),Math.round(totMin/60*10));
  const m={};keys.forEach((c,i)=>{m[c]=got[i]});
  return m;
}
const sumTenths=(m,keys)=>keys.reduce((s,c)=>s+(m[c]||0),0);
// 2. 时间去哪了 — real-time ring (period = full days × 24h, unrecorded
// remainder transparent) + top-4 categories.
function cardWhere(A,n){
  if(!A.tot)return scCard('sc.where',scEmpty());
  // The centre used to show non-sleep hours while the legend listed every
  // category INCLUDING sleep, so the two could never add up (36.5 vs
  // 55.2). The ring is "recorded vs unrecorded over the period", so the
  // centre now shows the same total the legend sums to, and the share of
  // the period is stated instead of left as an unexplained grey track.
  const periodMin=n*1440;
  const TT=catTenths(A.byCat,A.tot);
  const ring=ringSvg(catArcs(A.byCat,periodMin,c=>fmtTenths(TT[c])),
    {size:130,label:fmtHours(A.tot/60),labelSize:5.5,minLen:0.2});
  const pct=Math.round(A.tot/periodMin*100);
  const shareLine=`<div class="sc-line" style="margin-top:6px">${esc(t('sc.recorded',{p:pct,n}))}
    <span class="faint">· ${esc(A.range||'')}</span></div>`;
  const rows=Object.entries(A.byCat).sort((a,b)=>b[1]-a[1]);
  const list=rows.map(([c])=>
    `<div class="sc-row"><span class="dot" style="background:${catColor(c)}"></span>
      <span class="k">${esc(catLabel(c))}</span><span class="v">${fmtTenths(TT[c])}</span></div>`).join('');
  // 伴随 blocks are excluded from byCat/tot upstream (aggPeriod), so they
  // are never legend rows — say so, rather than leave a bare second number
  // the reader has to reconcile against the centre.
  const parLine=A.par?`<div class="sc-line">${esc(t('stat.parallel'))} ${fmtHours(A.par/60)}
    <span class="faint">· ${esc(t('stat.parNote'))}</span></div>`:'';
  return scCard('sc.where',`<div class="sc-ring"><div>${ring}</div>
    <div class="sc-legend" style="flex:1;min-width:150px">${list}</div></div>${shareLine}${parLine}`,
    'sc-card-wide');
}
// 3. 作息 — sleep-app style, zero judgment. Night-merge rule: for
// wake-day D, the "night of D" = sleep segments STARTING between 18:00 of
// D−1 and 14:00 of D (ends clipped to 14:00 D), merged into one record:
// 入睡 = first start, 起床 = last end, 实睡 = sum of segments, 中断 = gaps
// between them. Sleep starting 14:00–18:00 is a 小憩/nap, tallied per day.
function clockOfMs(ms){const d=new Date(ms);return d.getHours()*60+d.getMinutes()}
function nightRecords(){
  const raw={},naps={};
  DB.forEach(r=>{
    if(r.parallel||r.category!=='sleep')return;
    // an in-progress sleep (no real end yet) is not a night record —
    // evTime would synthesize a +60min end and fabricate a phantom night
    // that skews every median until the row is closed
    if(!r.end_at&&!r.end_time)return;
    const tm=evTime(r);
    if(!tm||tm.sm==null)return;
    const day0=new Date(tm.iso+'T00:00:00').getTime();
    const S=day0+tm.sm*60000, E=day0+tm.em*60000;
    const clock=tm.sm%1440;
    const durMin=Math.round((E-S)/60000);
    // Nap vs night is DURATION first, clock second (her 2026-08-16 call:
    // "白天我说睡觉了 你就觉得那不是小憩"). Classifying by clock alone put her
    // 8/14 18:25–20:10 1.8h evening nap into the next night's total, and read
    // her 8/11 11:56 2h midday nap as that night's sleep. Rule, checked
    // against all 14 of her recorded sleep blocks:
    //   ≥3.5h  → a night, whenever it starts (hers shift all over the clock)
    //   <3.5h starting 08:00–22:00 → a nap
    //   <3.5h starting 22:00–08:00 → a short night, still a night
    const isNap = durMin < 210 && clock >= 480 && clock < 1320;
    let D=null;
    if(!isNap){
      if(clock<840)D=tm.iso;                     // 00:00–13:59 → night of same day
      else D=shiftISO(tm.iso,1);                 // 14:00 起 → night of next day
    }
    if(D)(raw[D]=raw[D]||[]).push({S,E});
    else naps[tm.iso]=(naps[tm.iso]||0)+durMin;
  });
  const nights={};
  Object.entries(raw).forEach(([D,segs])=>{
    segs.sort((a,b)=>a.S-b.S);
    const lim=new Date(D+'T00:00:00').getTime()+14*3600000;   // 14:00 of D
    segs.forEach(x=>{if(x.E>lim)x.E=Math.max(x.S,lim)});
    let actual=0,gapN=0,gapMin=0;
    segs.forEach((x,i)=>{
      actual+=(x.E-x.S)/60000;
      if(i>0){const g=(x.S-segs[i-1].E)/60000;if(g>0){gapN++;gapMin+=g}}
    });
    nights[D]={segs,actualMin:Math.round(actual),gapN,gapMin:Math.round(gapMin),
      sleepAtMs:segs[0].S,wakeMs:segs[segs.length-1].E};
  });
  return {nights,naps};
}

// One day row: bar on an 18:00→14:00 scale, sleep segments filled, gaps
// left as track; ticks at 00:00 / 06:00. Labels 入睡/起床/实睡/中断 + 小憩.
function rhythmRow(D,night,napMin){
  const w0=new Date(shiftISO(D,-1)+'T00:00:00').getTime()+18*3600000;
  const SPAN=1200*60000;   // 20h
  let bar=`<span class="rh-tick" style="left:30%"></span>
    <span class="rh-tick" style="left:60%"></span>`;
  let meta;
  if(night){
    night.segs.forEach(x=>{
      const l=Math.max(0,x.S-w0)/SPAN*100, r=Math.min(SPAN,x.E-w0)/SPAN*100;
      bar+=`<span class="rh-seg" style="left:${l.toFixed(1)}%;width:${Math.max(0.8,r-l).toFixed(1)}%;background:${catColor('sleep')}"></span>`;
    });
    const parts=[
      esc(t('sc.sleep.start'))+' '+fmtClock(clockOfMs(night.sleepAtMs)),
      esc(t('sc.sleep.wake'))+' '+fmtClock(clockOfMs(night.wakeMs)),
      esc(t('sc.sleep.actual'))+' '+fmtHours(night.actualMin/60)];
    if(night.gapN)parts.push(esc(t('sc.sleep.gapN',{n:night.gapN}))+' '+fmtHours(night.gapMin/60));
    meta=parts.join(' · ');
  }else{
    meta=`<span class="sc-empty">—</span>`;
  }
  const nap=napMin?`<span class="rh-nap">${esc(t('sc.sleep.nap'))} ${fmtHours(napMin/60)}</span>`:'';
  // 本周/每日小结 sums sleep by CALENDAR day; this row is the NIGHT that
  // ended on D. Same date, different number — the label has to say which.
  return `<div class="rh-row"><span class="rh-day">${esc(md(D))}<span
      class="rh-qual">${esc(t('sl.nightOf'))}</span></span>
    <div class="rh-main"><div class="rh-bar">${bar}</div>
      <div class="rh-meta">${meta}${nap}</div></div></div>`;
}

function cardGrowth(A,vt){

// she ever logged, so the pre-tracking void doesn't drag the number down.
function cardCover(A,P,cur,prev,vt){
  let first=null;
  DB.forEach(r=>{
    const s=evSegments(r);

  });

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
// Build an ISO timestamptz from a local date+time in a named tz, by computing
// that wall-clock's UTC instant. Uses the offset the tz had at that date.
function toTimestamptz(dateISO,hm,tz){
  if(!dateISO||!hm)return null;
  // Pin the wall clock to UTC first (Date.UTC), THEN subtract the target
  // tz's offset — exactly one conversion. The old code parsed the string
  // with new Date(...), which reads it in the BROWSER's timezone, and then
  // also subtracted the NY offset: a double conversion that landed every
  // save +4h late in an ET browser (+5h EST). Two passes handle DST edges.
  const [y,mo,d]=dateISO.split('-').map(Number);
  const [h,mi]=hm.split(':').map(Number);
  const asUTC=Date.UTC(y,mo-1,d,h,mi,0);      // wall clock as if UTC
  let off=tzOffsetMin(new Date(asUTC),tz);
  off=tzOffsetMin(new Date(asUTC-off*60000),tz);
  return new Date(asUTC-off*60000).toISOString();
}
// minutes east of UTC for `tz` at the given (UTC-ish) date
function tzOffsetMin(date,tz){
  try{
    const dtf=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,
      year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const p={};dtf.formatToParts(date).forEach(x=>{if(x.type!=='literal')p[x.type]=x.value});
    const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);
    return Math.round((asUTC-date.getTime())/60000);
  }catch(e){return 0}
}

// Returns deduped overlap groups. Two events overlap when they share at
// least 1 minute of clock time on the SAME local day. We keep groups
// instead of pairs so a 3-way conflict (A∩B, A∩C, B∩C) renders once.
function overlapsList(){
  // index rows by local day, with their minute intervals. Parallel rows are
  // meant to coincide with a primary activity — never flag them as
  // conflicts. Recent days only (7d) AND never the future: recurring
  // schedule conflicts months ahead are not actionable chores.
  const vtOv=vTodayISO();
  const cutoff=shiftISO(vtOv,-6);
  const byDay={};
  DB.forEach(r=>{
    if(r.parallel)return;
    const tm=evTime(r);
    if(!tm||tm.sm==null||tm.iso<cutoff||tm.iso>vtOv)return;
    const e=Math.min(tm.em,1440);     // clip cross-midnight tail to same day
    if(e<=tm.sm)return;
    (byDay[tm.iso]=byDay[tm.iso]||[]).push({r,sm:tm.sm,em:e});
  });
  const out=[];
  Object.entries(byDay).forEach(([iso,evs])=>{
    evs.sort((a,b)=>a.sm-b.sm);
    // sweep line: build connected-overlap groups
    let group=null;
    for(const ev of evs){
      if(group&&ev.sm<group.maxEnd){
        group.evs.push(ev);
        group.maxEnd=Math.max(group.maxEnd,ev.em);
      }else{
        if(group&&group.evs.length>1)out.push({iso,evs:group.evs});
        group={maxEnd:ev.em,evs:[ev]};
      }
    }
    if(group&&group.evs.length>1)out.push({iso,evs:group.evs});
  });
  // newest day first
  return out.sort((a,b)=>b.iso.localeCompare(a.iso));
}
function renderOverlapRow(grp){

    const nm=evName(r);
    const tr=`${fm(ev.sm)}–${fm(ev.em)}`;

    return `<div class="ov-evt">

async function saveRowTimes(id){
  const d=document.getElementById('ei-d-'+id).value;
  const s=document.getElementById('ei-s-'+id).value;
  const e=document.getElementById('ei-e-'+id).value;
  if(!d||!s){toast(t('msg.needTime'),'err');return}
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  // Auto-yield (her spec 2026-08-12): the row being saved WINS; any clashing
  // same-day row keeps existing but its boundary moves to touch this one.
  // Trims run first so the DB overlap constraint never rejects the save.
  const hm=x=>{const[a,b]=x.split(':');return(+a)*60+(+b)};
  const fm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const nS=hm(s),nE=e?hm(e):nS+1;
  for(const r of DB){
    if(String(r.id)===String(id)||r.parallel)continue;
    const tm=evTime(r);
    if(!tm||tm.iso!==d||tm.sm==null)continue;
    const oe=Math.min(tm.em,1440);
    if(oe<=nS||tm.sm>=nE)continue;           // no clash
    let p=null;
    if(tm.sm<nS)p=buildTimePatch(d,fm(tm.sm),fm(nS),r.id); // yield its tail
    else if(oe>nE)p=buildTimePatch(d,fm(nE),fm(oe),r.id);  // yield its head
    // fully inside the saved interval: nothing sane to trim — leave it be
    if(p){const{error}=await sb.from('meetings').update(p).eq('id',r.id);
      if(error)console.warn('autoYield',error);}
  }
  await updateRow(id,buildTimePatch(d,s,e,id));
}

// Find gaps > MIN_GAP_MIN minutes on a given local iso day. A gap is the
// interval between the end of one event and the start of the next, clipped
// to the visible 07:00→07:00 next-day window so it matches the timeline.
const MIN_GAP_MIN=45;
function gapsForDay(iso){
  // collect intervals from events that fall on `iso`
  const ivs=[];
  DB.forEach(r=>{
    const tm=evTime(r);
    if(!tm||tm.iso!==iso||tm.sm==null)return;
    const s=tm.sm;
    const e=Math.min(tm.em,1440);   // clip cross-midnight tail
    if(e>s)ivs.push([s,e]);
  });
  // also include nothing for an empty day (will return single window-wide gap)
  ivs.sort((a,b)=>a[0]-b[0]);
  // merge overlapping
  const merged=[];
  ivs.forEach(iv=>{
    if(merged.length&&iv[0]<=merged[merged.length-1][1]){
      merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],iv[1]);
    }else merged.push([iv[0],iv[1]]);
  });
  // find gaps inside the active waking window (07:00→23:59 default — don't
  // surface sleep gaps as "problems")
  const WAKE_START=7*60, WAKE_END=23*60+59;
  const today=lDate(new Date());
  const nowM=iso===today?(new Date().getHours()*60+new Date().getMinutes()):WAKE_END;
  const upper=Math.min(WAKE_END,nowM);
  const gaps=[];
  let cursor=WAKE_START;
  merged.forEach(([s,e])=>{
    if(e<=WAKE_START||s>=upper)return;
    if(s>cursor&&s-cursor>=MIN_GAP_MIN)gaps.push([cursor,Math.min(s,upper)]);
    cursor=Math.max(cursor,e);
  });
  if(cursor<upper&&upper-cursor>=MIN_GAP_MIN)gaps.push([cursor,upper]);
  return gaps;
}

// two by line index — the translator is required to emit exactly one output

// needed. Her ask 2026-08-19.
function mnPairHtml(en,zh){

        +(p.content||'')).join('\n\n'),
      enhanced:parts.filter(p=>p.enhanced&&p.enhanced.trim())
        .map(p=>head(p)+p.enhanced).join('\n\n'),
      zh:parts.map(p=>(parts.length>1?head(p).replace(/^# /,'—— ').replace(/\n\n$/,' ——\n'):'')
        +(p.zh||'')).join('\n\n')

function cycStats(){
  const done=CYCLES.filter(c=>c.cycle_length).slice(0,6);
  if(!done.length)return null;
  const L=done.map(c=>c.cycle_length).sort((a,b)=>a-b);
  const med=L[Math.floor(L.length/2)];
  const P=done.map(c=>c.period_length).filter(Boolean);
  const pmed=P.length?P.sort((a,b)=>a-b)[Math.floor(P.length/2)]:null;

  const next=st?shiftISO(last.start_date,st.med):null;
  const dleft=next?dayDiff(next,today):null;

  // labelled as such so it is not read as data

  if(st)html+=`<div class="cyc-line faint">${esc(t('cyc.typ',{c:st.med,p:st.pmed??'—',n:st.n}))}</div>`;

  if(bars.length){

    html+=`<div class="cyc-hist">`+bars.map(c=>{

// 饮品 retired: drinks now classify as 正餐 (when they are the meal) or
// 加餐 (casual). Unknown/legacy kinds fall back to the 其他 style.
// 夜宵 added 2026-08-16: her rule is that food logged more than 30 min after
// the dinner block — or a second 晚餐 sticker in one day — is 夜宵, and she
// wants to see it as its own thing, not folded into 加餐.
const DIET_KINDS=['正餐','加餐','夜宵','其他'];
const DIET_KIND_I18N={'正餐':'diet.meal','加餐':'diet.snack','夜宵':'diet.late','其他':'diet.other'};
const DIET_KIND_COLOR={'正餐':'#ef8354','加餐':'#d9a520','夜宵':'#8b7dd8','其他':'#a98467'};
const dietKindOf=k=>DIET_KINDS.includes(k)?k:'其他';
// kcal may arrive as int OR as a numeric-type STRING from PostgREST —
// coerce once so no group/total silently drops or concatenates values
const kcalOf=e=>{const v=parseFloat(e&&e.kcal);return isNaN(v)?null:v};
// ---- Health dashboard cards -------------------------------------------
// Her call 2026-08-16: 8h is not reachable for her, so the target is the one
// she will actually aim at. A target nobody hits stops being a target and
// starts being a standing accusation — the debt curve only means something
// if the baseline is honest.
const SLEEP_TARGET_H=7.5;
const EX_WEEK_GOAL_MIN=150;  // tunable weekly exercise goal (minutes)
// Debt-only model (RISE-style): sleep cannot be banked — surplus nights
// REPAY accumulated debt but the balance floors at 0 and never goes
// positive. Per night: d = actual − target (factual delta), debt =
// max(0, debt − d). Chronological, only days with a merged night record.
function sleepDebt(days){
  const {nights}=nightRecords();
  const out=[];let debt=0;
  days.forEach(D=>{
    if(!nights[D])return;
    const d=nights[D].actualMin/60-SLEEP_TARGET_H;
    debt=Math.max(0,debt-d);
    out.push({D,d,debt});
  });
  return out;
}
// ONE median, one truth: 入睡/起床 medians over merged night records for
// any day window — used identically by the night-chart guide lines, the
// 本月/上月 card, and the 统计 rhythm card. Returns clock minutes.
function nightMedians(daysArr){
  const {nights}=nightRecords();
  const recs=daysArr.filter(D=>nights[D]).map(D=>nights[D]);
  if(!recs.length)return null;
  const s=median(recs.map(r=>(clockOfMs(r.sleepAtMs)-720+1440)%1440));
  const w=median(recs.map(r=>clockOfMs(r.wakeMs)));
  return {sClock:(Math.round(s)+720)%1440,wClock:Math.round(w)%1440,n:recs.length};
}
// 0–100 from the stdev of 入睡 times (since-noon mapping avoids midnight
// wrap): 100 − min(100, stdev_minutes/3). null when <2 nights.
function regularityScore(days){
  const {nights}=nightRecords();
  const starts=days.filter(D=>nights[D])
    .map(D=>(clockOfMs(nights[D].sleepAtMs)-720+1440)%1440);
  if(starts.length<2)return null;
  const m=starts.reduce((s,x)=>s+x,0)/starts.length;
  const sd=Math.sqrt(starts.reduce((s,x)=>s+(x-m)*(x-m),0)/starts.length);
  return Math.max(0,Math.round(100-Math.min(100,sd/3)));
}

      <div class="sc-line">${esc(t('h.bank.sub',{h:fmtHours(SLEEP_TARGET_H)}))}</div>`);
    return;

// Night bar segments as minutes since 18:00 of the previous day (the
// night window origin) — shared by the hero chart and its unit tests.
function nightBarSegs(D,night){
  const w0=new Date(shiftISO(D,-1)+'T00:00:00').getTime()+18*3600000;
  return night.segs.map(sg=>[(sg.S-w0)/60000,(sg.E-w0)/60000]);

// one popover body for a merged night — shared by the night bars and the

function nightPv(D,n,napMin){

    +pvRow(esc(t('sc.sleep.wake')),fmtClock(clockOfMs(n.wakeMs)))
    +pvRow(esc(t('sc.sleep.actual')),fmtHours(n.actualMin/60))
    +(n.gapN?pvRow(esc(t('sc.sleep.gapN',{n:n.gapN})),fmtHours(n.gapMin/60)):'')

// Hero chart (Apple Health / Oura pattern): x = last 14 days, y = clock

    // so the fallback states 实睡 and 中断 instead of the bare span
    fillCard('nightChartBox',sparseLine(have.map(D=>{
      const n=nights[D];
      const bits=[fmtClock(clockOfMs(n.sleepAtMs))+'–'+fmtClock(clockOfMs(n.wakeMs)),
        t('sc.sleep.actual')+' '+fmtHours(n.actualMin/60)];
      if(n.gapN)bits.push(t('sc.sleep.gapN',{n:n.gapN})+' '+fmtHours(n.gapMin/60));
      return [D,bits.join(' · ')];
    })));

  }
  const W=340,H=210,PL=36,PR=6,PT=8,PB=18;
  const yOf=m=>PT+m/1200*(H-PT-PB);
  const xw=(W-PL-PR)/days.length;

  });

  const med=nightMedians(have);
  if(med){
    [[med.sClock,'sc.sleep.start'],[med.wClock,'sc.sleep.wake']].forEach(([c,k])=>{
      const rel=Math.max(0,Math.min(1200,(c-1080+1440)%1440));
      const yy=yOf(rel).toFixed(1);
      svg+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}"
        style="stroke:var(--accent)" stroke-width="1.2" stroke-dasharray="4 3">
        <title>${esc(t(k))} ${fmtClock(c)}</title></line>`;
    });
  }
  // axis day labels for EVERY other day — never gated behind data

  days.forEach((D,i)=>{

    svg+=`<text x="${(PL+i*xw+xw/2).toFixed(1)}" y="${H-4}" font-size="8.5"

    const n=nights[D];if(!n)return;

      svg+=`<rect x="${bx}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        rx="${Math.min(bw/2,h/2).toFixed(1)}" data-pv="${pid}"

    if(r.parallel||r.category!=='eat')return;
    const tm=evTime(r);
    if(!tm||tm.sm==null)return;
    push(tm.iso,{s:tm.sm%1440,e:Math.min(tm.em,1439)%1440,
      name:evName(r),kind:'正餐',logged:false,id:r.id});
  });
  DIET.forEach(x=>{
    if(x.meal_id!=null||!x.created_at)return;
    const d=new Date(x.created_at);
    if(isNaN(d))return;
    const c=d.getHours()*60+d.getMinutes();
    push(lDate(d),{s:c,e:c,name:x.item||'',kind:dietKindOf(x.kind),logged:true,
      k:kcalOf(x)});
  });
  Object.keys(by).forEach(iso=>{
    const seen={},out=[];
    by[iso].sort((a,b)=>(a.s-b.s)||(a.e-b.e)).forEach(p=>{
      const k=p.s+'-'+p.e+'-'+p.logged;
      const hit=seen[k];
      if(hit){if(p.name&&hit.name.indexOf(p.name)<0)hit.name+=' + '+p.name;
        if(p.k!=null)hit.k=(hit.k==null?0:hit.k)+p.k;return}
      seen[k]=p;out.push(p);
    });
    by[iso]=out;
  });
  return by;
}
// first intake → last intake per day, straight off the same event list
function eatingWindows(){
  const ev=intakeEvents(),out={};
  Object.keys(ev).forEach(iso=>{
    if(!ev[iso].length)return;
    const a=Math.min(...ev[iso].map(p=>p.s)), b=Math.max(...ev[iso].map(p=>p.e));
    // flag the ENDPOINTS specifically: those are the numbers the window
    // prints, and a * on them points straight at the footnote
    out[iso]={a,b,ev:ev[iso],
      aLog:ev[iso].some(p=>p.logged&&p.s===a),
      bLog:ev[iso].some(p=>p.logged&&p.e===b)};
  });
  return out;
}
function mealDotData(){
  const ev=intakeEvents(),meals=[],snacks=[];
  Object.keys(ev).forEach(iso=>ev[iso].forEach(p=>{
    (p.logged?snacks:meals).push({iso,clock:p.s,e:p.e,name:p.name,kind:p.kind,
      logged:p.logged,id:p.id,k:p.k});
  }));
  return {meals,snacks,ev,wins:eatingWindows()};
}
function renderMealDots(){
  const days=lastNDaysEnd(vTodayISO(),14);
  const {meals,snacks,ev,wins}=mealDotData();
  const set=new Set(days);
  const m2=meals.filter(p=>set.has(p.iso)), s2=snacks.filter(p=>set.has(p.iso));
  if(!m2.length&&!s2.length){fillCard('mealDotsBox','');return}
  // item 4: an 88%-empty 14-day grid for one or two days of dots
  const dayset=new Set(m2.concat(s2).map(p=>p.iso));
  if(dayset.size<3){
    // every point the 进食窗口 bar spans is listed here, ranges included,
    // with * marking a 记录时间 point (no eating time was ever recorded)
    let anyLog=false;
    const rows=Array.from(dayset).sort().map(D=>{
      const list=(ev[D]||[]).map(p=>{
        if(p.logged)anyLog=true;
        return fmtClock(p.s)+(p.e>p.s+2?'–'+fmtClock(p.e):'')+(p.logged?'*':'');
      });
      return [D,list.join(' ')];
    });
    fillCard('mealDotsBox',sparseLine(rows)
      +(anyLog?`<div class="sc-line faint">${esc(t('dt.loggedNote'))}</div>`:''));
    return;
  }
  const W=340,H=210,PL=34,PR=6,PT=8,PB=18;
  const yOf=c=>PT+c/1440*(H-PT-PB);
  const xw=(W-PL-PR)/days.length;
  const xC=iso=>PL+days.indexOf(iso)*xw+xw/2;
  let svg='';
  [0,360,720,1080,1440].forEach(m=>{
    const yy=yOf(m).toFixed(1);
    svg+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/>
      <text x="${PL-5}" y="${+yy+3}" font-size="8.5" style="fill:var(--muted)" text-anchor="end">${fmtClock(m%1440)}</text>`;
  });
  // axis day labels first — for every other day, never data-gated
  days.forEach((D,i)=>{
    if(i%2)return;
    svg+=`<text x="${(PL+i*xw+xw/2).toFixed(1)}" y="${H-4}" font-size="8.5"
      style="fill:var(--muted)" text-anchor="middle">${+D.slice(8)}</text>`;
  });
  // faint eating-window band per day, behind the dots
  const spans=[];
  days.forEach((D,i)=>{
    const w=wins[D];
    if(!w)return;
    const a=w.a,b=w.b;
    spans.push(b-a);
    const bw=xw*0.6;
    svg+=`<rect x="${(PL+i*xw+(xw-bw)/2).toFixed(1)}" y="${yOf(a).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${Math.max(2,yOf(b)-yOf(a)).toFixed(1)}" rx="4"
      style="fill:${catColor('eat')};opacity:.13"/>`;
  });
  // hollow ring = 记录时间 (logged, not observed); filled = a real block.
  // Every dot gets a popover with the CONTENT of that intake — what was
  // eaten, kcal per item, meal total — not just a label and a time. An
  // invisible halo circle under each dot buys a real touch target.
  const pvReg=pvScope('meal');
  const dot=(p,pid,inner)=>`<circle cx="${xC(p.iso).toFixed(1)}" cy="${yOf(p.clock).toFixed(1)}"
      r="8" fill="transparent" data-pv="${pid}"></circle>${inner}`;
  s2.forEach(p=>{
    const pid=pvReg(pvT(esc(md(p.iso))+' '+fmtClock(p.clock)+'*')
      +pvRow(esc(p.name||'—'),p.k!=null?fmtKcal(p.k):'')
      +pvLine(esc(t('dt.loggedNote'))));
    svg+=dot(p,pid,`<circle cx="${xC(p.iso).toFixed(1)}" cy="${yOf(p.clock).toFixed(1)}" r="2.8"
      fill="none" stroke="${DIET_KIND_COLOR[p.kind]||DIET_KIND_COLOR['加餐']}" stroke-width="1.6"
      data-pv="${pid}"></circle>`);
  });
  m2.forEach(p=>{
    // the meal's items live in diet_log rows keyed by meal_id = the eat
    // block's event id; a meal without diet rows falls back to its name
    const items=p.id!=null
      ?DIET.filter(x=>x.meal_id!=null&&String(x.meal_id)===String(p.id)):[];
    let body='',totK=0,hasK=false;
    items.forEach(x=>{
      const v=kcalOf(x);
      if(v!=null){totK+=v;hasK=true}
      body+=pvRow(esc(x.item||'—'),v!=null?fmtKcal(v):'');
    });
    if(items.length>1&&hasK)body+=pvRow(LANG==='zh'?'合计':'total',fmtKcal(totK));
    if(!items.length)body=pvLine(esc(p.name||'—'));
    const tt=fmtClock(p.clock)+(p.e>p.clock+2?'–'+fmtClock(p.e):'');
    const pid=pvReg(pvT(esc(md(p.iso))+' '+tt)+body);
    svg+=dot(p,pid,`<circle cx="${xC(p.iso).toFixed(1)}" cy="${yOf(p.clock).toFixed(1)}" r="4.2"
      data-pv="${pid}" style="fill:${DIET_KIND_COLOR['正餐']}"></circle>`);
  });
  const avgLine=spans.length
    ?`<div class="sc-line" style="margin:0 0 6px">${esc(t('h.eat.avg',{h:fmtHours(spans.reduce((a,b)=>a+b,0)/spans.length/60)}))}</div>`:'';
  fillCard('mealDotsBox',avgLine+`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${svg}</svg>`
    +(s2.length?`<div class="sc-line faint">${esc(t('dt.loggedNote'))}</div>`:''));
}
function renderKcal(){
  const byDay={};

// Fill a card's box, hiding the WHOLE card when there is nothing to show
// (declutter: no placeholder walls).
function fillCard(id,html){
  const box=document.getElementById(id);
  if(!box)return;
  box.innerHTML=html||'';
  const card=box.closest('.card');
  if(card)card.classList.toggle('hidden',!html);
}
// visual-day list for a calendar month: off=0 current (1st → today),
// off=-1 the full previous month
function monthDays(off){
  const n=new Date();
  const s=new Date(n.getFullYear(),n.getMonth()+off,1);
  const e=off===0?n:new Date(n.getFullYear(),n.getMonth()+off+1,0);
  const out=[];const d=new Date(s);
  while(d<=e){out.push(lDate(d));d.setDate(d.getDate()+1);}
  return out;
}
function sleepMonthStats(off){
  const days=monthDays(off);
  const set=new Set(days);
  const {nights}=nightRecords();
  const recs=Object.entries(nights).filter(([D])=>set.has(D)).map(([D,n])=>({D,...n}));
  if(!recs.length)return null;
  const med=nightMedians(days);
  return {
    n:recs.length,
    avgH:recs.reduce((s,r)=>s+r.actualMin,0)/recs.length/60,
    sClock:med.sClock,wClock:med.wClock,
    longest:recs.reduce((a,b)=>b.actualMin>a.actualMin?b:a)
  };
}
function exMonthStats(off){
  const days=monthDays(off);
  const mins=exDailyMin(days);
  const vals=Object.values(mins);
  // one convention across 记账/饮食/运动: 暂无数据 means this metric's own
  // source has no rows for the month. `0 分钟` beside 暂无数据 on the other
  // tabs read as two different kinds of nothing.
  if(!vals.length)return null;
  return {
    total:vals.reduce((a,b)=>a+b,0),
    over30:Object.values(mins).filter(v=>v>=30).length
  };
}
function dietMonthStats(off){
  const set=new Set(monthDays(off));
  const rows=DIET.filter(e=>e.date&&set.has(e.date));
  if(!rows.length)return null;
  const byDay={};
  rows.forEach(e=>{const v=kcalOf(e);if(v!=null&&e.date)byDay[e.date]=(byDay[e.date]||0)+v});
  const kd=Object.keys(byDay);
  let maxD=null;kd.forEach(d=>{if(!maxD||byDay[d]>byDay[maxD])maxD=d});
  return {
    avgK:kd.length?kd.reduce((s,d)=>s+byDay[d],0)/kd.length:null,
    variety:new Set(rows.map(e=>(e.item||'').trim()).filter(Boolean)).size,
    maxD,maxK:maxD?byDay[maxD]:null
  };
}
// two labeled proportional bars (本月 vs 上月, value at the right end);
// a missing month renders 暂无数据 muted, exactly the Bohe pattern
function cmpRows(rows){
  return rows.map(r=>{
    const max=Math.max(r.cur||0,r.prev||0,1e-9);
    // A zero value used to keep its empty --well track, and a full-width
    // grey capsule beside a full-width accent capsule reads as "same
    // length, different colour" (0 min looked identical to 10 min). Zero
    // draws NO track at all — just the label and the honest 0.
    const bar=(v,cls,lbl)=>{
      const head=`<div class="cmp-row"><span class="cmp-lbl">${esc(lbl)}</span>`;
      if(v==null)return head+`<span class="cmp-val muted">${esc(t('cmp.none'))}</span></div>`;
      if(!(v>0))return head+`<span class="cmp-val muted">${esc(r.fmt(0))}</span></div>`;
      return head+`<div class="cmp-track"><div class="cmp-fill ${cls}"
            style="width:${Math.max(2,v/max*100).toFixed(1)}%"></div></div>
          <span class="cmp-val">${esc(r.fmt(v))}</span></div>`;
    };
    return `<div class="cmp-group"><div class="cmp-title">${esc(r.label)}</div>
      ${bar(r.cur,'cur',t('cmp.thisM'))}${bar(r.prev,'prev',t('cmp.lastM'))}</div>`;
  }).join('');
}
const starLine=s=>`<div class="star-line"><span class="st">★</span><span>${s}</span></div>`;
function renderCmpSleep(){
  const cur=sleepMonthStats(0),prev=sleepMonthStats(-1);
  if(!cur&&!prev){fillCard('cmpSleepBox','');return}
  let html=cmpRows([{label:t('cmp.sleepAvg'),
    cur:cur?cur.avgH:null,prev:prev?prev.avgH:null,fmt:v=>fmtHours(v)}]);
  const pair=(k,c,p)=>`<div><div class="cp-k">${esc(t(k))}</div>
    <div class="cp-v">${c!=null?fmtClock(c):'—'}</div>
    <div class="cp-p">${esc(t('cmp.lastM'))} ${p!=null?fmtClock(p):esc(t('cmp.none'))}</div></div>`;
  html+=`<div class="cmp-pair">
    ${pair('sc.sleep.start',cur?cur.sClock:null,prev?prev.sClock:null)}

  if(cur){

    html+=starLine(esc(t('st.sleepNights',{n:cur.n})));

function renderCmpEx(){

  let html=cmpRows([{label:t('cmp.exTotal'),

  if(cur&&cur.over30>0)html+=starLine(esc(t('st.exOver30',{n:cur.over30})));

function renderCmpDiet(){
  const cur=dietMonthStats(0),prev=dietMonthStats(-1);
  if(!cur&&!prev){fillCard('cmpDietBox','');return}
  let html=cmpRows([

// item 5: six charts drew a full 14-day/5-week grid for 1–2 points
// (~1300px of blank). Under 3 points we render one honest text line
// instead of a chart; with 3+ the axis uses the actual data range.
// The card already carries its own title, so the summary must NOT repeat
// it — 睡眠/饮食 read "入睡—起床 · 近14晚 · 入睡—起床 · 近14晚 · 08-08 …".
// Dates and values only. Rendered as real rows (the 小憩/类型分布 language)
// rather than one floating line, so the card body is filled instead of
// leaving a chart-sized blank under a single sentence.
function sparseLine(pairs){
  // a scalar third element buys a real proportional track — an inline bar
  // beats an empty box, and the card language already exists (cmp rows)
  const nums=pairs.map(p=>p[2]).filter(v=>typeof v==='number'&&isFinite(v)&&v>0);
  const max=nums.length===pairs.length?Math.max(...nums):0;
  return `<div class="sc-sparse">`+pairs.map(([d,v,n])=>max>0
    ?`<div class="cmp-row"><span class="cmp-lbl">${esc(md(d))}</span>
        <div class="cmp-track"><div class="cmp-fill"
          style="width:${Math.max(6,n/max*100).toFixed(1)}%"></div></div>
        <span class="cmp-val">${esc(v)}</span></div>`
    :`<div class="sc-row"><span class="k">${esc(md(d))}</span>
        <span class="v">${esc(v)}</span></div>`).join('')+`</div>`;
}
function trimRange(days,has){
  const idx=days.map((d,i)=>has(d)?i:-1).filter(i=>i>=0);
  if(idx.length<2)return days;
  return days.slice(idx[0],idx[idx.length-1]+1);
}
// ---- new 睡眠-tab charts ----------------------------------------------
// Bed/wake drift strip: last 14 nights as 入睡 (filled) and 起床 (ring)

function renderSlReg(){

  const yOf=m=>PT+m/1200*(H-PT-PB);

  const xw=(W-PL-PR)/days.length;
  let svg='';
  [0,360,720,1080].forEach(m=>{
    const yy=yOf(m).toFixed(1);
    svg+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/>
      <text x="${PL-5}" y="${+yy+3}" font-size="8.5" style="fill:var(--muted)" text-anchor="end">${fmtClock((1080+m)%1440)}</text>`;
  });
  const med=nightMedians(days);
  if(med)[[med.sClock,'sc.sleep.start'],[med.wClock,'sc.sleep.wake']].forEach(([c,k])=>{
    svg+=`<line x1="${PL}" x2="${W-PR}" y1="${yOf(relOf(c)).toFixed(1)}" y2="${yOf(relOf(c)).toFixed(1)}"
      style="stroke:var(--accent)" stroke-width="1.2" stroke-dasharray="4 3">
      <title>${esc(t(k))} ${fmtClock(c)}</title></line>`;
  });
  days.forEach((D,i)=>{
    if(i%2)return;   // labels for every other day, regardless of data
    svg+=`<text x="${(PL+i*xw+xw/2).toFixed(1)}" y="${H-4}" font-size="8.5"
      style="fill:var(--muted)" text-anchor="middle">${+D.slice(8)}</text>`;
  });
  const pvReg=pvScope('slreg');
  days.forEach((D,i)=>{
    const n=nights[D];if(!n)return;
    const cx=(PL+i*xw+xw/2).toFixed(1);
    const sC=clockOfMs(n.sleepAtMs),wC=clockOfMs(n.wakeMs);
    const pid=pvReg(nightPv(D,n,naps[D]));
    const sy=yOf(relOf(sC)).toFixed(1),wy=yOf(relOf(wC)).toFixed(1);
    // invisible halo circles under each dot buy a real touch target
    svg+=`<circle cx="${cx}" cy="${sy}" r="8" fill="transparent" data-pv="${pid}"></circle>
      <circle cx="${cx}" cy="${sy}" r="3.6" data-pv="${pid}" style="fill:${catColor('sleep')}"></circle>
      <circle cx="${cx}" cy="${wy}" r="8" fill="transparent" data-pv="${pid}"></circle>

function hxLastDay(h){
  if(!h.review_on)return h.started_on;

function hxProgress(h){
  if(!h.started_on)return '';
  const vt=vTodayISO(), s=String(h.started_on).slice(0,10);
  const dayN=Math.round((new Date(vt+'T00:00:00')-new Date(s+'T00:00:00'))/86400000);

    ?Math.round((new Date(String(h.review_on).slice(0,10)+'T00:00:00')-new Date(s+'T00:00:00'))/86400000)
    :null;

// item 5: the 2-up phone grid leaves a trailing lone card half-width with
// dead space beside it. fillCard() hides empty cards with .hidden, so CSS
// :nth-child parity counts cards that are not on screen — walk the VISIBLE
// cards, simulate the two-column flow (an .sc-card-wide card takes a whole
// row), and tag a last card that ends up alone on its row.
// The 记账/饮食/运动 grids are filled from async pulls that re-render
// without going through renderActive, so this must be called at the end of
// EVERY renderer that owns a .stat-grid, not only from renderActive.
function fitStatGrids(){
  const phone=isPhone();
  document.querySelectorAll('.stat-grid').forEach(g=>{
    const cards=Array.from(g.children).filter(el=>
      el.classList.contains('card')&&!el.classList.contains('hidden'));
    cards.forEach(c=>c.classList.remove('span2'));
    if(!phone||!cards.length)return;
    const W=g.clientWidth;
    if(!W)return;                       // grid is on a hidden tab
    // MEASURE the laid-out grid, never a paper model of it: dense
    // auto-flow, a .sc-card-wide row-breaker and hidden cards all move the
    // real columns, and the simulated version of this got the orphan wrong
    // on 记账/饮食/运动/统计 alike. Group cards by their actual top edge;
    // a row holding one card that does not already fill the width gets
    // stretched. Stretching reflows the rest, so re-measure until stable.
    for(let pass=0;pass<5;pass++){
      const rows=new Map();
      cards.forEach(c=>{
        const r=c.getBoundingClientRect();
        const k=Math.round(r.top);
        if(!rows.has(k))rows.set(k,[]);
        rows.get(k).push({c,w:r.width});
      });
      let changed=false;
      rows.forEach(list=>{
        if(list.length!==1)return;
        const {c,w}=list[0];
        if(w>=W-2||c.classList.contains('span2'))return;
        c.classList.add('span2');changed=true;
      });
      if(!changed)break;
    }
  });
}

const SPEND_CATS=['grocery','餐饮','日用','交通','娱乐','其他'];
const SPEND_COLOR={grocery:'#22a06b','餐饮':'#ef8354','日用':'#a98467',
  '交通':'#d9a520','娱乐':'#e879a9','其他':'#94a3b8'};
function spendCat(c){
  if(!c)return '其他';
  if(c==='car')return '交通';
  return SPEND_CATS.includes(c)?c:'其他';
}
function spLabel(c){const s=t('spc.'+c);return s==='spc.'+c?c:s}
// bought_at is a DATE column: PostgREST hands it back as "2026-08-09" with
// no time part, and new Date("2026-08-09") is parsed as UTC midnight — read
// back through local getters in any western timezone that is the PREVIOUS
// calendar day (every 08-09 purchase bucketed under 08-08). A date-only
// value is already the calendar day the user means; take it verbatim and
// only fall back to Date parsing for real timestamps (created_at).
function spendDay(p){
  const v=p.bought_at||p.created_at||'';
  const m=/^(\d{4}-\d{2}-\d{2})$/.exec(String(v).trim());
  if(m)return m[1];
  const d=new Date(v);
  return isNaN(d)?null:lDate(d);
}
// money is always two decimals — "$6" beside "$12.40" read as two
// different formats on one screen
const fmtUsd=v=>'$'+(Math.round(v*100)/100).toFixed(2);
const fmtCents=c=>'$'+(c/100).toFixed(2);
// savings parsed from notes like "$9.49 (折后$6.99, 省$2.50), Costco#1621"
function savingsOf(notes){
  const m=/省\s*\$?([0-9.]+)/.exec(notes||'');
  return m?parseFloat(m[1])||0:0;
}
// merchant = last comma segment of notes, minus a trailing HH:MM time;
// skipped when it still looks like price text
function merchantOf(notes){
  if(!notes)return '';
  const seg=String(notes).split(/[,，]/).pop().trim()
    .replace(/\s*\d{1,2}:\d{2}$/,'').trim();
  if(!seg||/[$￥]|省|折/.test(seg))return '';
  return seg;
}
function spendMonthStats(off){
  const set=new Set(monthDays(off));
  const rows=PURCHASES.filter(p=>{const d=spendDay(p);return d&&set.has(d)});
  if(!rows.length)return null;
  // null amounts stay in the ledger but never count toward sums.
  // Every sum is taken over PRINTED cents, so the month headline, the ring
  // centre, the category rows and the ledger day headers are all the same
  // arithmetic — a raw sum rounded at the end drifted a cent from the
  // ledger it is supposed to summarize.
  const amt=rows.filter(p=>p.amount_usd!=null);
  const cent=p=>Math.round(+p.amount_usd*100);
  const total=amt.reduce((s,p)=>s+cent(p),0)/100;
  let max=null;
  amt.forEach(p=>{if(!max||+p.amount_usd>+max.amount_usd)max=p});
  const byCat={};
  amt.forEach(p=>{const c=spendCat(p.category);byCat[c]=(byCat[c]||0)+cent(p)/100});
  // per-category row lists (ALL month rows, null amounts included) feed
  // the ring-segment popovers — names still inform even without a price
  const rowsByCat={};
  rows.forEach(p=>{const c=spendCat(p.category);(rowsByCat[c]=rowsByCat[c]||[]).push(p)});
  return {n:rows.length,total,max,byCat,rowsByCat,
    saved:rows.reduce((s,p)=>s+savingsOf(p.notes),0)};
}
function spendRowHtml(p){
  const qty=p.qty?` · ${esc(String(p.qty))}${p.unit?' '+esc(p.unit):''}`:'';
  const mer=merchantOf(p.notes);
  const amt=p.amount_usd!=null
    ?`<span class="v" style="color:var(--ink);font-weight:650">${fmtUsd(+p.amount_usd)}</span>`:'';
  return `<div class="sc-row"><span class="k">${esc(p.item||'')}${qty}${
    mer?` <span style="color:var(--muted);font-size:11px">${esc(mer)}</span>`:''}</span>${amt}</div>`;
}
function renderSpend(){
  const pvReg=pvScope('sp');
  // shared item-list body: up to 8 name+price rows, remainder counted
  const spItems=items=>items.slice(0,8).map(p=>pvRow(esc(p.item||'—'),
      p.amount_usd!=null?fmtUsd(+p.amount_usd):'')).join('')
    +(items.length>8?pvLine('… +'+(items.length-8)):'');
  const cur=spendMonthStats(0),prev=spendMonthStats(-1);
  // 1. 本月支出 headline + 本月/上月 bars + ★ insights
  if(!cur&&!prev){
    fillCard('spMonthBox','');
  }else{
    let html=`<span class="sc-big">${fmtUsd(cur?cur.total:0)}</span>`;
    html+=`<div style="margin-top:10px">${cmpRows([{label:t('cmp.title'),
      cur:cur?cur.total:null,prev:prev?prev.total:null,fmt:fmtUsd}])}</div>`;
    if(cur){
      html+=starLine(esc(t('st.spCount',{n:cur.n})));
      if(cur.max)html+=starLine(esc(t('st.spMax',
        {i:cur.max.item||'',v:fmtUsd(+cur.max.amount_usd)})));
      if(cur.saved>0)html+=starLine(esc(t('st.spSaved',{v:fmtUsd(cur.saved)})));
    }
    fillCard('spMonthBox',html);
  }
  // 2. 分类环 — same ring language as health/stats
  if(!cur||!cur.total){
    fillCard('spRingBox','');
  }else{
    let acc=0;const arcs=[];
    SPEND_CATS.forEach(c=>{
      const v=cur.byCat[c];if(!v)return;
      const items=cur.rowsByCat[c]||[];
      const pid=pvReg(pvT(`<span class="pv-dot" style="background:${SPEND_COLOR[c]}"></span>`
          +esc(spLabel(c))+' '+fmtUsd(v))
        +pvLine(esc(t('st.spCount',{n:items.length})))
        +spItems(items));
      arcs.push({f0:acc/cur.total,fl:v/cur.total,color:SPEND_COLOR[c],pv:pid});
      acc+=v;
    });
    const ring=ringSvg(arcs,{size:120,label:fmtUsd(cur.total),labelSize:4.6,minLen:0.2});
    // legend cents add up to the centre's cents exactly (same largest-
    // remainder rule the hour legends use)
    const lc=SPEND_CATS.filter(c=>cur.byCat[c]);
    const cents=unitAlloc(lc.map(c=>cur.byCat[c]*100),Math.round(cur.total*100));
    const legend=lc.map((c,i)=>
      `<div class="sc-row"><span class="dot" style="background:${SPEND_COLOR[c]}"></span>
        <span class="k">${esc(spLabel(c))}</span><span class="v">${fmtCents(cents[i])}</span></div>`).join('');
    fillCard('spRingBox',`<div class="sc-ring"><div>${ring}</div>
      <div style="flex:1;min-width:130px">${legend}</div></div>`);
  }
  // 3. 每日支出 — 14-day bars + average guide (exercise-bars pattern)
  const days=isoDaysBack(14);
  const byDay={},byDayRows={};
  PURCHASES.forEach(p=>{
    const d=spendDay(p);
    if(!d)return;
    (byDayRows[d]=byDayRows[d]||[]).push(p);   // bar popover: the day's items
    if(p.amount_usd==null)return;
    byDay[d]=(byDay[d]||0)+Math.round(+p.amount_usd*100)/100;
  });
  const nzS=days.filter(D=>byDay[D]>0);
  const vals=days.map(D=>byDay[D]||0);
  if(!nzS.length){
    fillCard('spDailyBox','');
  }else if(nzS.length<3){
    fillCard('spDailyBox',sparseLine(nzS.map(D=>[D,fmtUsd(byDay[D]),byDay[D]])));
  }else{
    const avg=vals.reduce((a,b)=>a+b,0)/days.length;
    const max=Math.max(...vals,avg);
    const W=300,H=118,PB=20;
    const step=(W-16)/days.length,bw=Math.min(16,step-4);
    const yOf=v=>H-PB-v/max*(H-PB-8);
    // visible baseline + first/last (=today) date ticks so a lone bar
    // reads anchored (sleep-debt chart pattern)
    let svg=`<line x1="8" x2="${W-8}" y1="${H-PB}" y2="${H-PB}" style="stroke:var(--line)"/>
      <text x="8" y="${H-5}" font-size="8.5" style="fill:var(--muted)">${days[0].slice(5)}</text>
      <text x="${W-8}" y="${H-5}" font-size="8.5" style="fill:var(--muted)"
        text-anchor="end">${days[days.length-1].slice(5)}</text>`;
    days.forEach((D,i)=>{
      const v=vals[i];if(!v)return;
      const pid=pvReg(pvT(esc(D.slice(5))+' · '+fmtUsd(v))+spItems(byDayRows[D]||[]));
      svg+=`<rect x="${(8+i*step+(step-bw)/2).toFixed(1)}" y="${yOf(v).toFixed(1)}"
        width="${bw.toFixed(1)}" height="${Math.max(2,(H-PB)-yOf(v)).toFixed(1)}" rx="2"
        data-pv="${pid}" style="fill:var(--accent);opacity:.9"></rect>`;
    });
    svg+=`<line x1="8" x2="${W-8}" y1="${yOf(avg).toFixed(1)}" y2="${yOf(avg).toFixed(1)}"
      style="stroke:var(--muted)" stroke-width="1.2" stroke-dasharray="4 3">
      <title>avg ${fmtUsd(avg)}</title></line>`;
    fillCard('spDailyBox',`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${svg}</svg>
      <div class="sc-line" style="margin-top:4px">${LANG==='zh'?'均线':'avg'} ${fmtUsd(avg)}</div>`);
  }
  // 4. 流水 — day-grouped ledger, older days collapsed
  const withDay=PURCHASES.map(p=>({p,d:spendDay(p)})).filter(x=>x.d);
  if(!withDay.length){
    fillCard('spListBox','');
  }else{
    const byD={};
    withDay.forEach(({p,d})=>{(byD[d]=byD[d]||[]).push(p)});
    const dayList=Object.keys(byD).sort().reverse();
    const dayBlock=d=>{
      const rows=byD[d];
      // a ledger row must show its own true price, so the day header adds
      // up the PRINTED prices rather than rounding the raw sum separately
      const cents=rows.reduce((s,p)=>
        s+(p.amount_usd!=null?Math.round(+p.amount_usd*100):0),0);
      return `<div class="memo-day">${d.slice(5)}${cents?' · '+fmtCents(cents):''}</div>`
        +rows.map(spendRowHtml).join('');
    };
    const recent=dayList.slice(0,7), older=dayList.slice(7);
    let html=recent.map(dayBlock).join('');
    if(older.length){
      html+=`<details class="kt-wrap"><summary class="kt-sum">
        <span>${esc(t('sp.earlier'))}</span><span class="kt-arrow">›</span></summary>
        ${older.map(dayBlock).join('')}</details>`;
    }
    fillCard('spListBox',html);
  }
  // section note when everything is hidden
  const any=['spMonthBox','spRingBox','spDailyBox','spListBox'].some(id=>{
    const b=document.getElementById(id);
    const c=b&&b.closest('.card');
    return c&&!c.classList.contains('hidden');
  });
  const note=document.getElementById('spendNote');
  if(note)note.classList.toggle('hidden',any);
  fitStatGrids();
}

let RECOS=[],recoLoaded=false;
// Everything recommended at her out loud — books, podcasts, video series,
// courses. Her advisor hands these out constantly and they used to live only
// in the transcript. Papers go to the Notion library instead; a paper row
// here is only a pointer, and once Notion has it the row is archived.

      .order('heard_on',{ascending:false}).limit(200);

const RECO_ICON={book:'\u{1F4D6}',podcast:'\u{1F3A7}',video:'\u{25B6}',course:'\u{1F393}',paper:'\u{1F4C4}'};
function renderRecos(){
  const host=document.getElementById('recoBox');
  if(!host)return;
  const live=RECOS.filter(r=>r.status!=='存档');
  const done=RECOS.filter(r=>r.status==='存档');

    <div class="reco-b">
      <div class="reco-t">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}

      ${r.why?`<div class="reco-w">${esc(r.why)}</div>`:''}
      <div class="reco-m">${esc(r.heard_on||'')}${r.in_notion?' · 已入文献库':''}</div>

const RECO_NEXT={'想看':'在看','在看':'看完','看完':'存档','存档':'想看'};
async function cycleReco(id){
  const r=RECOS.find(x=>String(x.id)===String(id));if(!r)return;
  const next=RECO_NEXT[r.status]||'想看';
  try{
    const {error}=await sb.from('recos').update({status:next}).eq('id',id);
    if(error)throw error;
    r.status=next; renderRecos();
  }catch(e){toast(t('msg.cloudErr'),'err')}
}
let MEMOS=[],memoLoaded=false;
async function pullMemos(){
  if(!cloud||!authed)return;
  try{
    const {data,error}=await sb.from('memos').select('*')
      .order('created_at',{ascending:false});
    if(error)throw error;

// rows written before the kind column existed have no kind — they are
// short-term, so anything that is not explicitly 'long' stays where it was
const memoKind=m=>(m&&m.kind==='long')?'long':'short';
function memoListHtml(list){
  let html='',lastDay='';
  list.forEach(m=>{
    const d=m.created_at?new Date(m.created_at):null;
    const day=d?lDate(d):'—';
    const tm=d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'';
    if(day!==lastDay){html+=`<div class="memo-day">${day}</div>`;lastDay=day;}
    html+=`<div class="memo-row"><span class="m-tm">${tm}</span>
      <span class="m-tx">${esc(m.content||'')}</span>
      <button class="m-del" title="delete" onclick="delMemo('${m.id}')">✕</button></div>`;
  });
  return html;
}
function renderMemos(){
  const q=(document.getElementById('memo-q').value||'').trim().toLowerCase();
  const rows=MEMOS.filter(m=>!q||(m.content||'').toLowerCase().includes(q));
  const host=document.getElementById('memoBox');
  if(!rows.length){host.innerHTML=`<div class="rev-empty">${esc(t('memo.empty'))}</div>`;return}
  const shortRows=rows.filter(m=>memoKind(m)==='short');
  const longRows=rows.filter(m=>memoKind(m)==='long');
  let html='';
  // an empty half prints nothing at all — no bare heading
  if(shortRows.length)
    html+=`<div class="memo-sec">${esc(t('memo.short'))}</div>`+memoListHtml(shortRows);
  if(longRows.length)
    html+=`<details class="kt-wrap memo-long"${q?' open':''}><summary class="kt-sum">
      <span>${esc(t('memo.longFold'))}</span><span class="kt-arrow">›</span></summary>
      ${memoListHtml(longRows)}</details>`;
  host.innerHTML=html;
}
let MEMO_KIND='short';
function setMemoKind(k){
  MEMO_KIND=(k==='long')?'long':'short';
  const s=document.getElementById('mk-short'),l=document.getElementById('mk-long');
  if(s)s.classList.toggle('active',MEMO_KIND==='short');
  if(l)l.classList.toggle('active',MEMO_KIND==='long');
}
async function addMemo(){
  if(!cloud||!authed){toast(t('msg.authFail'),'err');return}
  const el=document.getElementById('memo-new');
  const content=el.value.trim();
  if(!content)return;
  try{
    const {error}=await sb.from('memos').insert({content,kind:MEMO_KIND});
    if(error)throw error;
    el.value='';setMemoKind('short');toast(t('msg.saved'),'ok');
    await pullMemos();renderMemos();
  }catch(e){console.warn('addMemo',e);toast(t('msg.cloudErr'),'err')}
}
async function delMemo(id){
  if(!cloud||!authed)return;
  const {error}=await sb.from('memos').delete().eq('id',id);
  if(error){console.warn('delMemo',error);toast(t('msg.cloudErr'),'err');return}
  MEMOS=MEMOS.filter(m=>String(m.id)!==String(id));
  renderMemos();
}
